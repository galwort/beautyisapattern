<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <title>Adaptation in Motion</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #e6e6e6;
        }

        .archive-link {
            position: absolute;
            bottom: 20px;
            left: 20px;
            text-decoration: none;
            color: #333333;
            font-family: 'Georgia', serif;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .archive-link:hover {
            box-shadow: 0px 0px 10px rgba(50, 50, 50, 0.5);
            transform: scale(1.05);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let particles = [];
        const numParticles = 100;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle(random(width), random(height), random(2, 6)));
            }
        }

        function draw() {
            background(230, 230, 230, 50);
            particles.forEach(particle => {
                particle.move();
                particle.display();
            });
        }

        class Particle {
            constructor(x, y, r) {
                this.x = x;
                this.y = y;
                this.r = r;
                this.color = color(random(150, 255), random(150, 255), random(150, 255), 150);
                this.xSpeed = random(-1.5, 1.5);
                this.ySpeed = random(-1.5, 1.5);
            }

            move() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;

                this.xSpeed += random(-0.1, 0.1);
                this.ySpeed += random(-0.1, 0.1);

                if (this.x > width || this.x < 0) this.xSpeed *= -1;
                if (this.y > height || this.y < 0) this.ySpeed *= -1;
            }

            display() {
                fill(this.color);
                ellipse(this.x, this.y, this.r * 2);
            }
        }

    </script>
</head>
<body>
    <a href="https://www.beautyisapattern.com/archive" class="archive-link">Explore the Archive</a>
</body>
</html>
