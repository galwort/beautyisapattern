<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embrace the Good</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.0/lib/p5.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; }
        body { background-color: #e6efff; }
        .link-container {
            position: absolute;
            top: 90%;
            right: 5%;
            text-align: center;
        }
        .archive-link {
            text-decoration: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 15px;
            color: #333;
            background: #ffdda1;
            padding: 10px 15px;
            border-radius: 7px;
            box-shadow: 2px 5px 8px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <script>
        let circles = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
            for (let i = 0; i < 15; i++) {
                circles.push(new Circle(random(width), random(height), random(30, 80)));
            }
        }

        function draw() {
            background('#e6efff');

            // Render and animate circles
            circles.forEach(circle => {
                circle.move();
                circle.display();
            });

            // Drawing the serene ground
            fill('#c6ebc9');
            noStroke();
            beginShape();
            for (let x = 0; x <= width; x += 10) {
                let y = height - 100 + noise(x * 0.05, frameCount * 0.01) * 50;
                vertex(x, y);
            }
            vertex(width, height);
            vertex(0, height);
            endShape(CLOSE);
        }

        class Circle {
            constructor(x, y, diameter) {
                this.x = x;
                this.y = y;
                this.diameter = diameter;
                this.vx = random(0.5, 2);
                this.vy = random(0.5, 2);
                this.fillColor = color(random(180, 255), random(180, 255), random(50, 80));
            }

            move() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off the edges
                if (this.x > width || this.x < 0) {
                    this.vx *= -1;
                }
                if (this.y > height || this.y < 0) {
                    this.vy *= -1;
                }
            }

            display() {
                fill(this.fillColor);
                ellipse(this.x, this.y, this.diameter, this.diameter);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <div class="link-container">
        <a class="archive-link" href="https://www.beautyisapattern.com/archive">View the Archive</a>
    </div>
</body>
</html>
