<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony in Chaos</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0e0e0e;
        }
        #archive-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #aaa;
            text-decoration: none;
            font-size: 12px;
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let circles = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
            for (let i = 0; i < 100; i++) {
                circles.push(new Circle(random(width), random(height), random(3, 10)));
            }
        }

        function draw() {
            background(20, 24, 82, 40);
            circles.forEach(circle => {
                circle.update();
                circle.display();
            });
        }

        class Circle {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = [random(100, 255), random(100, 255), random(100, 255)];
                this.speedX = random(-1, 1);
                this.speedY = random(-1, 1);
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > width) this.speedX *= -1;
                if (this.y < 0 || this.y > height) this.speedY *= -1;

                this.color = [(this.color[0] + random(-2, 2)) % 255, (this.color[1] + random(-2, 2)) % 255, (this.color[2] + random(-2, 2)) % 255];
            }

            display() {
                fill(...this.color, 150);
                ellipse(this.x, this.y, this.radius * 2);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive" target="_blank">Explore the Archive</a>
</body>
</html>
