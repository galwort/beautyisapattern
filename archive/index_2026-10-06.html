<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wings of Time</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2C3E50; /* Dark ocean blue */
        }
        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ECF0F1;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        footer a {
            color: #E67E22;
            text-decoration: none;
            border-bottom: 1px dotted #E67E22;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let birds = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < 15; i++) {
                birds.push(new Bird(random(width), random(height)));
            }
            noCursor();
        }

        function draw() {
            background(44, 62, 80, 80); // Transparent ocean blue
            birds.forEach(bird => {
                bird.update();
                bird.display();
            });
        }

        class Bird {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = createVector(random(-0.5, 0.5), random(-0.5, 0.5));
                this.size = random(30, 70);
                this.offset = random(PI);
            }

            update() {
                this.pos.add(this.vel);
                if (this.pos.x > width) this.pos.x = 0;
                if (this.pos.x < 0) this.pos.x = width;
                if (this.pos.y > height) this.pos.y = 0;
                if (this.pos.y < 0) this.pos.y = height;
                this.vel.add(p5.Vector.random2D().mult(0.05));
            }

            display() {
                push();
                noStroke();
                fill(236, 240, 241, 200); // Light silvery color
                translate(this.pos.x, this.pos.y);
                scale(0.8);
                let wingSpan = sin(frameCount * 0.05 + this.offset) * this.size / 2;
                beginShape();
                vertex(0, 0);
                bezierVertex(this.size, -wingSpan, this.size, wingSpan, 0, this.size);
                bezierVertex(-this.size, wingSpan, -this.size, -wingSpan, 0, 0);
                endShape(CLOSE);
                pop();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <footer>
        <a href="https://www.beautyisapattern.com/archive" target="_blank" rel="noopener noreferrer">Discover More Patterns</a>
    </footer>
</body>
</html>
