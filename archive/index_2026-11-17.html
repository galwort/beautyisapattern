<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <title>Shimmer of Tenacity</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0d0d0d;
        }
        #archive-link {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #76ead7;
            text-decoration: none;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let attempts = [];
        let successLight;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < 100; i++) {
                let x = random(width);
                let y = random(height);
                attempts.push(new Attempt(x, y));
            }
            successLight = new SuccessLight(width / 2, height / 2);
        }

        function draw() {
            background(13);
            for (let attempt of attempts) {
                attempt.update();
                attempt.display();
            }
            successLight.update();
            successLight.display();
        }

        class Attempt {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = random(3, 10);
                this.alpha = random(50, 100);
            }

            update() {
                this.x += random(-1, 1);
                this.y += random(-1, 1);

                if (random() > 0.995) {
                    this.alpha = random(50, 255);
                }
            }

            display() {
                noStroke();
                fill(150, 30, 30, this.alpha);
                ellipse(this.x, this.y, this.size);
            }
        }

        class SuccessLight {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 50;
                this.brightness = 0;
            }

            update() {
                if (random() < 0.02) {
                    this.brightness = 255;
                }
                this.brightness *= 0.95;
            }

            display() {
                noStroke();
                fill(255, 255, 0, this.brightness);
                ellipse(this.x, this.y, this.size);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive">Visit Archive</a>
</body>
</html>
