<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ephemeral Dance</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(160deg, #0c1445, #1a1a5e, #0c1445);
            height: 100vh;
        }
        #archive-link {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #efefef;
            text-decoration: none;
            font-family: 'Verdana', sans-serif;
            opacity: 0.8;
            background-color: rgba(50, 50, 50, 0.4);
            padding: 10px 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        #archive-link:hover {
            opacity: 1;
            background-color: rgba(50, 50, 50, 0.6);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let fadingCircles = [];
        const numCircles = 200;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < numCircles; i++) {
                let size = random(50, 100);
                let lifespan = random(200, 500);
                fadingCircles.push(new Circle(random(width), random(height), size, lifespan));
            }
        }

        function draw() {
            background(20, 30, 60, 20); // Creates deeper blending trail
            for (let circle of fadingCircles) {
                circle.update();
                circle.display();
            }
        }

        class Circle {
            constructor(x, y, size, lifespan) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.lifespan = lifespan;
                this.age = 0;
                this.color = color(random(100, 255), random(100, 255), random(100, 255));
                this.speedX = random(-0.5, 0.5);
                this.speedY = random(-0.5, 0.5);
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.age++;
                if (this.age > this.lifespan) {
                    this.reset();
                }
            }

            display() {
                noStroke();
                fill(this.color.levels[0], this.color.levels[1], this.color.levels[2], this.opacity());
                ellipse(this.x, this.y, this.size);
            }

            reset() {
                this.x = random(width);
                this.y = random(height);
                this.size = random(50, 100);
                this.lifespan = random(200, 500);
                this.age = 0;
                this.color = color(random(100, 255), random(100, 255), random(100, 255));
                this.speedX = random(-0.5, 0.5);
                this.speedY = random(-0.5, 0.5);
            }

            opacity() {
                // Modulate transparency with lifetime
                let fadeIn = this.lifespan * 0.3;
                let fadeOut = this.lifespan * 0.7;
                if (this.age < fadeIn) {
                    return map(this.age, 0, fadeIn, 20, 100);
                } else if (this.age > fadeOut) {
                    return map(this.age, fadeOut, this.lifespan, 100, 20);
                }
                return 100;
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive">Visit Full Archive</a>
</body>
</html>
