<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony of Differences</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        #archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #eee;
            font-family: 'Arial', sans-serif;
            text-decoration: none;
            background-color: rgba(26, 26, 26, 0.8);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.9em;
            transition: background-color 0.3s;
        }
        #archive-link:hover {
            background-color: rgba(46, 46, 46, 0.8);
        }
    </style>
</head>
<body>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive" target="_blank">
        Visit our Archive
    </a>
    <script>
        let angle = 0;
        let colors = [];
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
            // Create a set of colors to symbolize different parties
            colors = [
              color(255, 204, 0), 
              color(0, 150, 255), 
              color(255, 80, 80),
              color(102, 255, 178)
            ];
        }

        function draw() {
            background(26, 26, 26, 50);

            translate(width/2, height/2);
            // Draw multiple rotating circles
            for (let i = 0; i < colors.length; i++) {
                let offset = TWO_PI / colors.length * i;
                let px = cos(angle + offset) * 150;
                let py = sin(angle + offset) * 150;

                fill(colors[i]);
                ellipse(px, py, 80, 80);

                fill(255, 50);
                ellipse(px, py, 120, 120);
            }

            // Central merging point symbolizes compromise
            fill(255);
            ellipse(0, 0, 50, 50);

            angle += 0.01;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
