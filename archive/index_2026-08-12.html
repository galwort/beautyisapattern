<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roads to Fulfillment</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121212;
        }
        .archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
        }
        .archive-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <script>
        let pathways = [];
        let numPaths = 3;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < numPaths; i++) {
                pathways.push(new Pathway(random(width), random(height)));
            }
        }

        function draw() {
            background(18, 18, 18);
            blendMode(SCREEN);
            for (let i = 0; i < pathways.length; i++) {
                pathways[i].display();
                pathways[i].move();
            }
        }

        class Pathway {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.color = color(random(255), random(255), random(255), 150);
                this.direction = random(TWO_PI);
            }

            display() {
                noStroke();
                fill(this.color);
                ellipse(this.x, this.y, 60);
            }

            move() {
                let noiseFactor = noise(this.x * 0.01, this.y * 0.01);
                this.direction += map(noiseFactor, 0, 1, -0.05, 0.05);
                this.x += cos(this.direction) * 2;
                this.y += sin(this.direction) * 2;

                // Wrap around logic
                if (this.x > width) this.x = 0;
                if (this.x < 0) this.x = width;
                if (this.y > height) this.y = 0;
                if (this.y < 0) this.y = height;
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <a class="archive-link" href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
</body>
</html>
