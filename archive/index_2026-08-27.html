<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burning Affection</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: rgba(0,0,0,0.8);
            margin: 0;
            overflow: hidden;
            color: white;
            font-family: Arial, sans-serif;
        }
        #footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
        }
        #footer a {
            color: #f97600;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <script>
        let particles = [];

        function setup() {
            const canvas = createCanvas(windowWidth, windowHeight);
            canvas.style('z-index', '-1');
            for(let i = 0; i < 250; i++) {
                particles.push(new Particle(random(width), random(height)));
            }
        }

        function draw() {
            background(0, 50);

            particles.forEach(p => {
                p.update();
                p.show();
            });
        }

        class Particle {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = p5.Vector.random2D().mult(random(0.5, 2));
                this.acc = createVector(0, 0);
                this.size = random(2, 8);
                this.lifespan = 255;
            }

            update() {
                this.vel.add(this.acc);
                this.pos.add(this.vel);
                this.lifespan -= 2;
                if (this.lifespan < 0) this.lifespan = 0;
                this.acc.mult(0);
            }

            show() {
                noStroke();
                fill(255, 150, 50, this.lifespan);
                ellipse(this.pos.x, this.pos.y, this.size);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <div id="footer">
        <a href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
    </div>
</body>
</html>
