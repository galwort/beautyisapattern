<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enduring Bonds</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.0/lib/p5.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #e5eef8;
        }
        #archive-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #064663;
            font-family: 'Courier New', Courier, monospace;
            text-decoration: none;
            background: rgba(230, 239, 255, 0.8);
            padding: 6px 12px;
            border-radius: 12px;
            transition: background-color 0.3s ease;
        }
        #archive-link:hover {
            background-color: rgba(230, 239, 255, 1);
        }
    </style>
</head>
<body>
<a href="https://www.beautyisapattern.com/archive" id="archive-link">Visit Archive</a>
<script>
    let nodes = [];
    let edges = [];
    const connectionThreshold = 150;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        for (let i = 0; i < 75; i++) {
            let randomPos = createVector(random(width), random(height));
            nodes.push(new Node(randomPos));
        }
        establishEdges();
    }

    function draw() {
        background('#e5eef8');
        for (let edge of edges) {
            edge.display();
        }
        for (let node of nodes) {
            node.update();
            node.display();
        }
    }

    function establishEdges() {
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                let d = dist(nodes[i].pos.x, nodes[i].pos.y, nodes[j].pos.x, nodes[j].pos.y);
                if (d < connectionThreshold) {
                    edges.push(new Edge(nodes[i], nodes[j], map(d, 0, connectionThreshold, 2, 0.5)));
                }
            }
        }
    }

    class Node {
        constructor(pos) {
            this.pos = pos;
            this.vel = createVector(random(-1, 1), random(-1, 1));
            this.r = random(4, 8);
        }

        update() {
            this.pos.add(this.vel);
            if (this.pos.x > width || this.pos.x < 0) this.vel.x *= -1;
            if (this.pos.y > height || this.pos.y < 0) this.vel.y *= -1;
        }

        display() {
            noStroke();
            fill('#0f4c75');
            ellipse(this.pos.x, this.pos.y, this.r);
        }
    }

    class Edge {
        constructor(node1, node2, thickness) {
            this.node1 = node1;
            this.node2 = node2;
            this.thickness = thickness;
        }

        display() {
            stroke('#1b262c');
            strokeWeight(this.thickness);
            line(this.node1.pos.x, this.node1.pos.y, this.node2.pos.x, this.node2.pos.y);
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>
</body>
</html>
