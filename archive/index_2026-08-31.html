<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <title>Sweet Harmony of Friendship</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #f8f9fa;
            overflow: hidden;
        }
        .archive-link {
            position: absolute;
            bottom: 10px;
            right: 20px;
            color: #007bff;
            font-size: 14px;
            text-decoration: none;
            font-family: 'Helvetica Neue', sans-serif;
        }
        .archive-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <script>
        let flowers = [];
        const maxFlowers = 15;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
            for (let i = 0; i < maxFlowers; i++) {
                flowers.push(createFlowerObject());
            }
        }

        function draw() {
            background('#fff3cd');
            for (let flower of flowers) {
                drawFlower(flower);
                updateFlower(flower);
            }
        }

        function createFlowerObject() {
            const baseSize = random(30, 70);
            return {
                petals: int(random(6, 12)),
                x: random(width),
                y: random(height),
                size: baseSize,
                baseColor: random(['#ff6f91', '#ffa07a', '#f88379', '#ffb6c1']),
                angle: random(TWO_PI),
                speed: random(0.005, 0.015)
            };
        }

        function drawFlower({ x, y, size, petals, baseColor, angle }) {
            push();
            translate(x, y);
            rotate(angle);
            for (let i = 0; i < petals; i++) {
                fill(baseColor);
                ellipse(0, size / 2, size / 4, size);
                rotate(TWO_PI / petals);
            }
            fill('rgba(255, 223, 186, 0.9)');
            ellipse(0, 0, size / 2);
            pop();
        }

        function updateFlower(flower) {
            flower.angle += flower.speed;
            flower.x += sin(flower.angle * 2) * 0.5;
            flower.y += cos(flower.angle * 2) * 0.5;
            wrapPosition(flower);
        }

        function wrapPosition(flower) {
            if (flower.x > width + flower.size || flower.x < -flower.size) {
                flower.x = random(width);
            }
            if (flower.y > height + flower.size || flower.y < -flower.size) {
                flower.y = random(height);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

    <a href="https://www.beautyisapattern.com/archive" class="archive-link">Visit the Archive</a>
</body>
</html>
