<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Passion for the Possible</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 1rem;
            text-decoration: none;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s, color 0.3s;
        }
        #archive-link:hover {
            background: rgba(255, 255, 255, 0.5);
            color: #000000;
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script>
    const stars = [];
    const maxStars = 200;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        for (let i = 0; i < maxStars; i++) {
            stars.push(new Star());
        }
    }

    function draw() {
        background(18, 18, 18);
        translate(width / 2, height / 2);
        for (let star of stars) {
            star.update();
            star.show();
        }
    }

    class Star {
        constructor() {
            this.x = random(-width, width);
            this.y = random(-height, height);
            this.z = random(width);
            this.pz = this.z;
        }

        update() {
            this.z -= 4;
            if (this.z < 1) {
                this.z = width;
                this.x = random(-width, width);
                this.y = random(-height, height);
                this.pz = this.z;
            }
        }

        show() {
            fill(255);
            noStroke();

            const sx = map(this.x / this.z, 0, 1, 0, width);
            const sy = map(this.y / this.z, 0, 1, 0, height);

            const r = map(this.z, 0, width, 8, 0);
            ellipse(sx, sy, r, r);

            const px = map(this.x / this.pz, 0, 1, 0, width);
            const py = map(this.y / this.pz, 0, 1, 0, height);

            this.pz = this.z;

            stroke(255);
            line(px, py, sx, sy);
        }
    }
</script>

<a id="archive-link" href="https://www.beautyisapattern.com/archive">Visit the Archive</a>

</body>
</html>
