<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartfelt Freedom</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle, #ffffff, #bbe0e9);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            color: #666;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        a {
            margin-bottom: 20px;
            text-decoration: none;
            color: #3c87a3;
            font-weight: bold;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <script>
        let bubbles = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            // Create bubble-like hearts that float freely
            for (let i = 0; i < 15; i++) {
                let size = random(40, 90);
                bubbles.push(new Bubble(random(width), random(height, height * 1.2), size));
            }
        }

        function draw() {
            clear();
            for (let bubble of bubbles) {
                bubble.move();
                bubble.display();
            }
        }

        class Bubble {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.ySpeed = random(-1, -3);
                this.color = color(random(200, 255), random(100, 200), random(100, 200), 180);
            }

            move() {
                this.y += this.ySpeed;
                if (this.y < -this.size) {
                    this.y = height + this.size;
                    this.x = random(width);
                }
            }

            display() {
                noStroke();
                fill(this.color);
                beginShape();
                for (let angle = 0; angle < TWO_PI; angle += 0.1) {
                    let x = this.size * 16 * pow(sin(angle), 3);
                    let y = -this.size * (13 * cos(angle) - 5 * cos(2 * angle) - 2 * cos(3 * angle) - cos(4 * angle));
                    vertex(this.x + x, this.y + y);
                }
                endShape(CLOSE);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <a href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
</body>
</html>
