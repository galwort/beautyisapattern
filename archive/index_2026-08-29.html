<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphony of Snowflakes</title>
    <link rel="shortcut icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1b263b; /* Deep blue for a night sky effect */
        }
        #archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #fff;
            text-decoration: none;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 5px;
        }
        #archive-link:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let snowflakes = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            fill(240);
            noStroke();
        }

        function draw() {
            background(27, 38, 59, 50);

            let t = frameCount / 60; // update time

            for (let i = 0; i < random(1, 3); i++) {
                snowflakes.push(new snowflake()); // append snowflake object
            }

            // loop through snowflakes with a for..of loop
            for (let flake of snowflakes) {
                flake.update(t); // update snowflake position
                flake.display(); // draw snowflake
            }
        }

        // snowflake class
        function snowflake() {
            // initialize coordinates
            this.posX = 0;
            this.posY = random(-50, 0);
            this.initialangle = random(0, 2 * PI);
            this.size = random(2, 5);

            // radius of snowflake spiral
            // chosen so the snowflakes are uniformly spread out in area
            this.radius = sqrt(random(pow(width / 2, 2)));

            this.update = function (time) {
                // x position follows a circle
                let w = 0.6; // angular speed
                let angle = w * time + this.initialangle;
                this.posX = width / 2 + this.radius * sin(angle);

                // different size snowflakes fall at slightly different y speeds
                this.posY += pow(this.size, 0.5);

                // delete snowflake if past end of screen
                if (this.posY > height) {
                    let index = snowflakes.indexOf(this);
                    snowflakes.splice(index, 1);
                }
            };

            this.display = function () {
                ellipse(this.posX, this.posY, this.size);
            };
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive" target="_blank">Explore the Archive</a>
</body>
</html>
