<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
  <title>Echoes of Absence</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #e0f7fa;
    }
    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
    }
    a {
      font-family: Arial, sans-serif;
      color: #00796b;
      text-decoration: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>

<script>
  const circles = [];
  const numCircles = 80;

  function setup() {
    createCanvas(windowWidth, windowHeight);
    for (let i = 0; i < numCircles; i++) {
      circles.push(new Circle(random(width), random(height), random(30, 100)));
    }
    noStroke();
  }

  function draw() {
    background(224, 247, 250, 90);  // dim background for persistence
    for (const circle of circles) {
      circle.update();
      circle.display();
    }
  }

  class Circle {
    constructor(x, y, size) {
      this.x = x;
      this.y = y;
      this.size = size;
      this.offsetX = random(-0.5, 0.5);
      this.offsetY = random(-0.5, 0.5);
      this.phase = random(TWO_PI);
      this.frequency = random(0.005, 0.015);
    }

    update() {
      this.x += this.offsetX;
      this.y += this.offsetY;
      this.x = (this.x + width) % width;
      this.y = (this.y + height) % height;
    }

    display() {
      fill(0, 150, 136, 80 + 50 * sin(this.phase));
      ellipse(this.x, this.y, this.size + 10 * sin(this.phase));
      this.phase += this.frequency;
    }
  }

  function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
  }

</script>

<footer>
  <a href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
</footer>

</body>
</html>
