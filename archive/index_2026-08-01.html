<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonic Visions</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(45deg, #3c3b3f, #605c3c);
        }

        footer {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #eeeeee;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
        }

        a {
            color: #dddddd;
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let t = 0; // time variable
        function setup() {
            createCanvas(windowWidth, windowHeight);
            noFill();
            stroke(255, 204, 0); // A golden color
            strokeWeight(2);
            blendMode(SCREEN);
        }

        function draw() {
            background(0, 20); // Give a faint trail effect

            translate(width / 2, height / 2);
            for (let i = 0; i < 10; i++) {
                stroke(255, 204, 0, 150 - i * 15);
                rotate(t / 10);
                beginShape();
                for (let j = 0; j < TWO_PI; j += 0.1) {
                    let xOffset = sin(j * 3 + t) * (100 - i * 10);
                    let yOffset = cos(j * 3 + t) * (100 - i * 10);
                    let x = cos(j + t / 2) * 150 + xOffset;
                    let y = sin(j - t / 2) * 150 + yOffset;
                    vertex(x, y);
                }
                endShape(CLOSE);
            }
            t += 0.02;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

    <footer>
        <a href="https://www.beautyisapattern.com/archive" target="_blank">Explore the Archive</a>
    </footer>
</body>
</html>
