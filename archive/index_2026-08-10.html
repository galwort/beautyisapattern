<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <title>Rhythm of the Day</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #101010;
        }

        .archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffffff;
            text-decoration: none;
            font-family: 'Roboto', sans-serif;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.5);
            transition: background 0.3s ease;
        }

        .archive-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        function setup() {
            createCanvas(windowWidth, windowHeight);
            noFill();
        }

        function draw() {
            background(16, 16, 16, 25);

            let timeValues = [
                { color: [255, 204, 0, 150], angleSpeed: 0.001 }, // Morning Sun
                { color: [240, 128, 128, 150], angleSpeed: 0.008 }, // Noon Energy
                { color: [255, 140, 0, 180], angleSpeed: 0.004 }, // Evening Calm
                { color: [255, 255, 255, 50], angleSpeed: 0.0005 }, // Night Stars
            ];

            translate(width / 2, height / 2);

            for (let i = 0; i < timeValues.length; i++) {
                push();
                rotate(millis() * timeValues[i].angleSpeed);
                stroke(...timeValues[i].color);
                beginShape();
                for (let angle = 0; angle < TWO_PI; angle += 0.1) {
                    let x = cos(angle) * (i + 1) * 60;
                    let y = sin(angle) * (i + 1) * 60;
                    vertex(x, y);
                }
                endShape(CLOSE);
                pop();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <a class="archive-link" href="https://www.beautyisapattern.com/archive" target="_blank">Visit Archive</a>
</body>
</html>
