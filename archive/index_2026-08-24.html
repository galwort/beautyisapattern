<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <title>Reflections of Inner and Outer Insight</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1b1b2f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: #f2a365;
            margin-top: 25px;
            font-size: 1.2em;
        }

        #canvasContainer {
            position: relative;
        }
    </style>
</head>
<body>

<div id="canvasContainer"></div>
<a href="https://www.beautyisapattern.com/archive" target="_blank">Explore the Archive</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script>
    let x_offsets = [];
    let numCircles = 10;
    let radius = 250;

    function setup() {
        const canvas = createCanvas(windowWidth, windowHeight);
        canvas.parent('canvasContainer');
        noFill();
        strokeWeight(2);

        for (let i = 0; i < numCircles; i++) {
            x_offsets[i] = random(TWO_PI);
        }
    }

    function draw() {
        background('#1b1b2f');
        translate(width / 2, height / 2);

        for (let i = 0; i < numCircles; i++) {
            let n = noise(x_offsets[i]) * radius;
            let g = map(noise(x_offsets[i]), 0, 1, 0.5, 0.9);
            let circleColor = lerpColor(color(227, 119, 70), color(68, 230, 165), g);
            stroke(circleColor);
            ellipse(0, 0, n * 2, n * 2);
            x_offsets[i] += 0.01;
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>
</body>
</html>
