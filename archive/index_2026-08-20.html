<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispers of Transformation</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle, #f0f0f0, #e0e0e0);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            padding: 10px 0;
            font-family: Arial, sans-serif;
        }
        a {
            color: #ffcc00;
            text-decoration: none;
            transition: color 0.3s;
        }
        a:hover {
            color: #ff9900;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let layers = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < 100; i++) {
                layers.push(new Layer(random(width), random(height), random(30, 120)));
            }
            noStroke();
        }

        function draw() {
            background(240, 240, 245);
            for (let layer of layers) {
                layer.update();
                layer.display();
            }
        }

        class Layer {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.angle = random(TWO_PI);
                this.angularSpeed = random(0.01, 0.05);
                this.growthRate = random(0.1, 0.5);
            }

            update() {
                this.angle += this.angularSpeed;
                this.radius += sin(this.angle) * this.growthRate;
            }

            display() {
                fill(100, 150, 250, 150);
                ellipse(this.x + sin(this.angle) * 20, this.y + cos(this.angle) * 20, this.radius * cos(this.angle));
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>

    <footer>
        Dive into our <a href="https://www.beautyisapattern.com/archive">archive</a> for deeper insights.
    </footer>

</body>
</html>
