<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Beauty Within Reach</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(145deg, #e0e5ec, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        a {
            position: fixed;
            bottom: 10px;
            right: 10px;
            text-decoration: none;
            color: #333;
            font-family: Arial, sans-serif;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: rgba(255, 255, 255, 1);
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script>
    let particles = [];
    const shapes = [
        (x, y, size) => { // Circle
            ellipse(x, y, size);
        },
        (x, y, size) => { // Triangle
            triangle(x, y - size / 2, x - size / 2, y + size / 2, x + size / 2, y + size / 2);
        },
        (x, y, size) => { // Square
            rect(x - size / 2, y - size / 2, size, size);
        }
    ];

    function setup() {
        createCanvas(windowWidth, windowHeight);
        for (let i = 0; i < 50; i++) {
            particles.push(new Particle(random(width), random(height), random(15, 50)));
        }
    }

    function draw() {
        background(240, 245, 255, 50); // Light translucent background
        for (const particle of particles) {
            particle.update();
            particle.display();
        }
    }

    class Particle {
        constructor(x, y, size) {
            this.x = x;
            this.y = y;
            this.size = size;
            this.shape = random(shapes);
            this.angle = random(TWO_PI);
            this.spin = random(-0.05, 0.05);
        }

        update() {
            this.angle += this.spin;
        }

        display() {
            push();
            translate(this.x, this.y);
            rotate(this.angle);
            noStroke();
            fill(random(100, 255), random(100, 255), random(150, 255), 150);
            this.shape(0, 0, this.size);
            pop();
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>

<a href="https://www.beautyisapattern.com/archive">Explore More Patterns</a>

</body>
</html>
