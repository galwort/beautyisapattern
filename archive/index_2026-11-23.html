<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Gift of a Smile</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #fdf7f2;
        }
        #archive {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #7A6C5D;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }
        #archive:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <script>
        let smileColors = ['#FFADAD', '#FFD6A5', '#FDFFB6', '#CAFFBF', '#9BF6FF', '#A0C4FF', '#BDB2FF', '#FFC6FF'];
        let smile = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < 8; i++) {
                smile.push(new Smile(random(width), random(height), random(smileColors)));
            }
        }

        function draw() {
            clear();
            background('#fdf7f2');
            for (let s of smile) {
                s.move();
                s.display();
            }
        }

        class Smile {
            constructor(x, y, c) {
                this.x = x;
                this.y = y;
                this.color = c;
                this.size = random(30, 60);
                this.xSpeed = random(1, 4) * (random() < 0.5 ? 1 : -1);
                this.ySpeed = random(1, 4) * (random() < 0.5 ? 1 : -1);
            }

            move() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;

                if (this.x < 0 || this.x > width) this.xSpeed *= -1;
                if (this.y < 0 || this.y > height) this.ySpeed *= -1;
            }

            display() {
                // Draw smiling face
                fill(this.color);
                noStroke();
                ellipse(this.x, this.y, this.size);
                fill('#332c2a');
                ellipse(this.x - this.size / 4, this.y - this.size / 5, this.size / 5, this.size / 6);
                ellipse(this.x + this.size / 4, this.y - this.size / 5, this.size / 5, this.size / 6);
                noFill();
                stroke('#332c2a');
                strokeWeight(2);
                arc(this.x, this.y, this.size / 2, this.size / 2, 0, PI);
            }
        }
    </script>

    <a id="archive" href="https://www.beautyisapattern.com/archive">Explore the Beauty Archive</a>
</body>
</html>
