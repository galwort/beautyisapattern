<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time's Flowing Canvas</title>
    <link rel="icon" type="image/x-icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f1f1f1;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        footer {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
        }
        footer a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }
        footer a:hover {
            color: #f9a825;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let shapes = [];
        const numShapes = 80;
        let timePassed = 0;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
            for (let i = 0; i < numShapes; i++) {
                shapes.push({
                    x: random(width),
                    y: random(height),
                    speedX: random(0.5, 2),
                    speedY: random(0.5, 2),
                    size: random(20, 50),
                    color: color(random(100, 255), random(100, 255), random(255)),
                    angleOffset: random(TWO_PI)
                });
            }
        }

        function draw() {
            background(245);
            timePassed += deltaTime * 0.0001;

            shapes.forEach(shape => {
                fill(shape.color);
                let angle = timePassed + shape.angleOffset;
                shape.x += cos(angle) * shape.speedX;
                shape.y += sin(angle) * shape.speedY;

                // Boundary wrapping
                if (shape.x > width + shape.size) shape.x = -shape.size;
                if (shape.x < -shape.size) shape.x = width + shape.size;
                if (shape.y > height + shape.size) shape.y = -shape.size;
                if (shape.y < -shape.size) shape.y = height + shape.size;

                ellipse(shape.x, shape.y, shape.size);
            });
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <footer>
        <a href="https://www.beautyisapattern.com/archive" target="_blank">Visit the Archive</a>
    </footer>
</body>
</html>
