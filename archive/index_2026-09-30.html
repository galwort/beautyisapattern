<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripples of Wonder</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }
        .archive-link {
            position: absolute;
            bottom: 10px;
            left: 10px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 3px;
            transition: background 0.3s, color 0.3s;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .archive-link:hover {
            background: rgba(255, 255, 255, 0.8);
            color: #000;
        }
    </style>
</head>
<body>

<script>
    const numWaves = 14;
    const waveHeights = Array(numWaves).fill(0);
    const waveHeightMax = 50;
    const waveColors = [
        '#00A1E0', '#00B5E2', '#00CFE4', '#71DBE7', '#BCEDEE',
        '#FFF7F5', '#FFD2D1', '#FAA8A3', '#FF6F61', '#CC4A49'
    ];
    let speed = 0.05;

    function setup() {
        createCanvas(windowWidth, windowHeight);
    }

    function draw() {
        background(0);
        noFill();
        strokeWeight(2);
        translate(width / 2, height / 2);
        rotate(frameCount * speed * 0.1);

        for (let i = 0; i < numWaves; i++) {
            beginShape();
            stroke(waveColors[i % waveColors.length]);
            for (let a = 0; a < TWO_PI; a += 0.1) {
                let r = waveHeights[i] * sin(a * (i + 1) + frameCount * speed);
                let x = r * cos(a);
                let y = r * sin(a);
                vertex(x, y);
            }
            endShape(CLOSE);
            waveHeights[i] = map(sin(frameCount * 0.01 + i), -1, 1, 15, waveHeightMax);
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>

<a href="https://www.beautyisapattern.com/archive" class="archive-link">Explore the Archive</a>

</body>
</html>
