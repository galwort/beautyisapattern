<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embracing Resilience: Beyond Failures</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            height: 100vh;
        }
        a {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #007BFF;
            text-decoration: none;
            font-size: 16px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let balls = [];
        let gravity = 0.2;
        let bgColor;

        class Ball {
            constructor(x, y, r) {
                this.x = x;
                this.y = y;
                this.r = r;
                this.vy = 0;
            }

            update() {
                this.vy += gravity;
                this.y += this.vy;
                if (this.y > height - this.r) {
                    this.vy *= -0.7; // Slightly bounce back
                    this.y = height - this.r;
                    this.r *= 0.95; // Simulate energy loss
                }
            }

            display() {
                noStroke();
                fill(255, 150, 0);
                ellipse(this.x, this.y, this.r * 2);
                // Trail effect
                fill(255, 150, 0, 70);
                for (let i = 0; i < 5; i++) {
                    ellipse(this.x, this.y - i * 10, this.r * 2 - i);
                }
            }
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            bgColor = color(235, 238, 240);
            for (let i = 0; i < 15; i++) {
                let x = random(0, width);
                let y = random(-100, 0);
                let r = random(15, 30);
                balls.push(new Ball(x, y, r));
            }
        }

        function draw() {
            background(bgColor);
            for (let ball of balls) {
                ball.update();
                ball.display();
            }
            // Darken screen incrementally
            fadeBackground();
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function fadeBackground() {
            if (frameCount % 3 === 0) {
                bgColor = lerpColor(bgColor, color(235, 238, 240, 200), 0.005);
            }
        }
    </script>
</head>
<body>
    <a href="https://www.beautyisapattern.com/archive">Visit the Archive</a>
</body>
</html>
