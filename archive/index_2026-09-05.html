<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inner Transformation</title>
  <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon" />
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, #eef2f3, #ffffff);
    }

    #archive-link {
      position: absolute;
      bottom: 10px;
      right: 10px;
      text-decoration: none;
      color: #666;
      font-size: 0.8em;
      font-family: Arial, sans-serif;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
</head>

<body>

  <script>
    let start = 0;
    let w, cols, rows;
    const scl = 20; // Scale size of the grid

    function setup() {
      createCanvas(window.innerWidth, window.innerHeight, WEBGL);
      cols = floor(width / scl);
      rows = floor(height / scl);
      w = scl * cols;
    }

    function draw() {
      background(240, 240, 255);

      translate(width / 2, height / 2 + 50); // Move origin point
      rotateX(PI / 3); // Angle of view

      for (let y = 0; y < rows; y++) {
        beginShape(TRIANGLE_STRIP);
        for (let x = 0; x < cols; x++) {
          fill((x * 255) / cols, (y * 255) / rows, 150, 200);
          stroke(255);

          const d = dist(x * scl, y * scl, width / 2, height / 2);
          const offset = map(d, 0, 500, -PI, PI);
          const a = start + offset;

          const z1 = map(sin(a), -1, 1, -100, 100);
          vertex(x * scl - w / 2, y * scl - (rows * scl) / 2, z1);

          const z2 = map(sin(a + 0.1), -1, 1, -100, 100);
          vertex(x * scl - w / 2, (y + 1) * scl - (rows * scl) / 2, z2);
        }
        endShape();
      }

      start += 0.05; // Speed of wave
    }
  </script>

  <h2 id="archive-link">
    <a id="archive-link" href="https://www.beautyisapattern.com/archive">Explore Patterns Archive</a>
  </h2>

</body>

</html>
