<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echoes of Acclamation</title>
  <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #archive-link {
      position: absolute;
      bottom: 10px;
      right: 10px;
      color: #ddd;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 8px;
      transition: background 0.3s;
    }
    #archive-link:hover {
      background: rgba(255, 255, 255, 0.6);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>

<script>

let applauseRipples = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  noStroke();
  let initialX = width / 2;
  let initialY = height / 2;
  applauseRipples.push(new Ripple(initialX, initialY));
}

function draw() {
  background(0, 10);
  if (frameCount % 60 === 0) { 
    let x = width/2 + random(-50, 50);
    let y = height/2 + random(-50, 50);
    applauseRipples.push(new Ripple(x, y));
  }

  for (let i = applauseRipples.length - 1; i >= 0; i--) {
    let ripple = applauseRipples[i];
    ripple.update();
    ripple.show();
    if (ripple.isFinished()) {
      applauseRipples.splice(i, 1);
    }
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

class Ripple {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.r = 0;
    this.alpha = 255;
  }

  update() {
    this.r += 2;
    this.alpha -= 2;
  }

  show() {
    fill(255, this.alpha);
    ellipse(this.x, this.y, this.r * 2);
  }

  isFinished() {
    return this.alpha <= 0;
  }
}

</script>

<a id="archive-link" href="https://www.beautyisapattern.com/archive" target="_blank">Visit the Archive</a>

</body>
</html>
