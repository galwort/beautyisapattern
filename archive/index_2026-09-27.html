<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony in Conflict</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            position: relative;
        }
        #archive {
            position: fixed;
            bottom: 10px;
            right: 10px;
            text-decoration: none;
            color: #FFD700;
            font-size: 1.1em;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let angle = 0;
        function setup() {
            createCanvas(windowWidth, windowHeight);
            angleMode(DEGREES);
        }
        function draw() {
            background(0, 0, 26);
            translate(width / 2, height / 2);
            let hueValue = 0;
            for (let i = 0; i < 360; i += 10) {
                strokeWeight(3);
                let x = cos(angle + i) * (width / 5);
                let y = sin(angle + i) * (height / 5);
                if (i % 30 === 0) {
                    hueValue += 10;
                    stroke(color(`hsb(${(hueValue) % 360}, 100%, 70%)`));
                } else {
                    stroke(50);
                }
                line(0, 0, x, y);
            }
            angle += 0.2;
            
            // Draw a calming gradient circle behind the lines
            let alternateRadius = sin(frameCount * 0.5) * width / 6;
            drawGradientCircle(0, 0, width / 3 + alternateRadius);
        }
        
        function drawGradientCircle(x, y, radius) {
            for(let r = radius; r > 0; --r) {
                let alpha = map(r, radius, 0, 0, 255);
                fill(0, 102, 255, alpha);
                noStroke();
                ellipse(x, y, r * 2);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <a href="https://www.beautyisapattern.com/archive" id="archive">Visit the Archive</a>
</body>
</html>
