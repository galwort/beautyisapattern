<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Balance of Connection</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb);
        }

        .archive-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-family: Arial, sans-serif;
            color: #ffffff;
            text-shadow: 0px 0px 5px rgba(0,0,0,0.5);
            text-decoration: none;
        }

        .archive-link:hover {
            color: #ffefd5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>

<!-- Link to the archive -->
<a href="https://www.beautyisapattern.com/archive" class="archive-link">Visit the Archive</a>

<script>
    let stars = [];
    let friends = [];
    let numStars = 200;
    let numFriends = 6;
    
    function setup() {
        createCanvas(windowWidth, windowHeight);
        
        // Create stars
        for (let i = 0; i < numStars; i++) {
            stars.push(new Star());
        }

        // Create friends
        for (let i = 0; i < numFriends; i++) {
            friends.push(new Friend(random(width), random(height)));
        }
    }

    function draw() {
        background(20, 30, 48);

        // Display and move stars
        for (let star of stars) {
            star.update();
            star.display();
        }

        // Display and animate friends
        for (let friend of friends) {
            friend.display();
            friend.update();
        }
    }

    class Star {
        constructor() {
            this.x = random(width);
            this.y = random(height);
            this.size = random(1, 3);
            this.speed = random(0.5, 1.5);
        }

        update() {
            this.y += this.speed;
            if (this.y > height) {
                this.y = 0;
                this.x = random(width);
            }
        }

        display() {
            noStroke();
            fill(255, 255, 255, 200);
            circle(this.x, this.y, this.size);
        }
    }

    class Friend {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.angle = random(TWO_PI);
            this.size = random(20, 50);
            this.color = color(random(160, 240), random(100, 180), random(100, 180), 150);
        }

        update() {
            this.angle += 0.01;
            this.x = width / 2 + cos(this.angle) * width / 4;
            this.y = height / 2 + sin(this.angle) * height / 4;
        }

        display() {
            fill(this.color);
            noStroke();
            ellipse(this.x, this.y, this.size, this.size);
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>

</body>
</html>
