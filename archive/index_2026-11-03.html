<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flow of Thought</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            background: #f0f0f3;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        #footer {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 14px;
            color: #555;
        }

        #footer a {
            color: #007acc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let ripple = [];
        let maxWaves = 50;
        let waveColor = [0, 122, 204];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noFill();
        }

        function draw() {
            background(240);
            translate(width / 2, height / 2);

            for(let i = 0; i < ripple.length; i++) {
                let current = ripple[i];
                stroke(waveColor[0], waveColor[1], waveColor[2], map(current.alpha, 0, 255));
                strokeWeight(map(current.alpha, 0, 255, 0.5, 3));
                ellipse(current.x, current.y, current.diameter);
                current.diameter += 0.5;
                current.alpha -= 0.5;

                if(current.alpha <= 0) {
                    ripple.splice(i, 1);
                    i--;
                }
            }

            if(frameCount % 5 == 0 && ripple.length < maxWaves) {
                let angle = random(TWO_PI);
                let distance = random(100, 300);
                ripple.push({
                    x: cos(angle) * distance,
                    y: sin(angle) * distance,
                    diameter: 20,
                    alpha: 255
                });
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

    <div id="footer">
        <a href="https://www.beautyisapattern.com/archive" target="_blank">Explore the Archive</a>
    </div>
</body>
</html>
