<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unveiling Through Struggles</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #101010;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ccc;
            position: relative;
        }
        footer {
          position: absolute;
          bottom: 15px;
          width: 100%;
          text-align: center;
          color: #888;
          font-size: 14px;
        }
        a { 
          color: #60c4ff; 
          text-decoration: none;
          transition: color 0.3s ease;
        }
        a:hover {
          color: #89ebff;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let t = 0;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            frameRate(60);
        }

        function draw() {
            background(16, 16, 16, 25);
            noFill();
            strokeWeight(1.5);
            
            // Draw orbiting circles
            translate(width / 2, height / 2);
            for (let i = 0; i < 10; i++) {
                stroke(100 + i * 15, 200 - i * 20, 255 - i * 10);
                push();
                let phase = PI / 5 * i;
                rotate(t + phase);
                ellipse(100 + i * 10, 0, 50, 50);
                pop();
            }
            
            t += 0.01;  // Increment time for animation
        }
        
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <footer>
        Explore the journey at <a href="https://www.beautyisapattern.com/archive" target="_blank">Beauty Is A Pattern</a>
    </footer>
</body>
</html>
