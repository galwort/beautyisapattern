<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephemeral Treasures</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
        }
        #archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ddd;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-decoration: none;
            background-color: rgba(50, 50, 50, 0.7);
            padding: 5px 10px;
            border-radius: 3px;
            transition: background-color 0.3s ease;
        }
        #archive-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let sparkles = [];
        let gravity = 0.07;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < 20; i++) {
                sparkles.push(new Sparkle(width / 2, height / 2));
            }
        }

        function draw() {
            background(26, 26, 26, 220);
            for (let sparkle of sparkles) {
                sparkle.update();
                sparkle.display();
                sparkle.fade();
            }
        }

        class Sparkle {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = createVector(random(-1, 1), random(-1, 1));
                this.acc = createVector(0, gravity);
                this.alpha = 255;
                this.size = random(5, 10);
            }

            update() {
                this.vel.add(this.acc);
                this.pos.add(this.vel);
                if (this.pos.x < 0 || this.pos.x > width) this.vel.x *= -1;
                if (this.pos.y > height) {
                    this.vel.y *= -1;
                }
            }

            fade() {
                if (this.alpha > 0) this.alpha -= 2;
                if (this.size > 0) this.size -= 0.05;
            }

            display() {
                noStroke();
                fill(255, 204, 0, this.alpha);
                ellipse(this.pos.x, this.pos.y, this.size);
            }
        }

        function mousePressed() {
            sparkles.push(new Sparkle(mouseX, mouseY));
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive">Explore More</a>
</body>
</html>
