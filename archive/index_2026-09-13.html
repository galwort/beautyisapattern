<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molding the Steps</title>
    <link rel="icon" type="image/x-icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #eef2f7;
            font-family: Arial, sans-serif;
        }
        #archive {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #333;
            text-decoration: none;
            font-size: 13px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        #archive:hover {
            background-color: rgba(200, 200, 200, 0.8);
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script>
    let shoeAngle = 0;
    let shoeLength = 140;
    let path;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        path = createVector(width/2, height);
    }

    function draw() {
        background(238, 242, 247);

        // Draw path (symbolizing the changing foot)
        stroke(100, 100, 150);
        strokeWeight(4);
        noFill();
        let yOffset = height;
        beginShape();
        for (let x = 0; x < width; x += 50) {
            vertex(x, yOffset + sin(x * 0.05 + frameCount * 0.03) * 20);
            yOffset -= shoeLength / 10;
        }
        endShape();

        // Calculate shoe position along path
        let x = frameCount % (width + shoeLength) - shoeLength;
        let y = height/2 + sin(x * 0.05 + frameCount * 0.03) * 20;

        // Draw shoe as changing ellipse
        let shoeWidth = map(sin(shoeAngle), -1, 1, 30, 60);
        shoeAngle += 0.05;

        fill(100, 140, 180);
        ellipse(x, y, shoeWidth, shoeWidth / 1.5);
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>

<a id="archive" href="https://www.beautyisapattern.com/archive" target="_blank">Visit the Archive</a>

</body>
</html>
