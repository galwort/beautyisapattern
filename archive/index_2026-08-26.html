<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtle Shades of Control</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000000;
        }
        .link-archive {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #ffffff;
            text-decoration: none;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <a class="link-archive" href="https://www.beautyisapattern.com/archive" target="_blank">Explore the Past</a>
    <script>
        let angle = 0;
        let radius;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            radius = min(windowWidth, windowHeight) / 4;
            strokeWeight(2);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            radius = min(windowWidth, windowHeight) / 4;
        }

        function draw() {
            background(0, 25);
            translate(width / 2, height / 2);
            let maxLines = 150;

            for (let i = 0; i < maxLines; i++) {
                let theta = map(i, 0, maxLines, 0, TWO_PI) + noise(angle) * 5;
                let x1 = radius * cos(theta);
                let y1 = radius * sin(theta);
                let x2 = x1 * noise(angle + 5);
                let y2 = y1 * noise(angle + 5);

                stroke(lerpColor(color('#FF6F61'), color('#6B5B95'), i / maxLines));
                line(x1, y1, x2, y2);
            }

            angle += 0.005;
        }
    </script>
</body>
</html>
