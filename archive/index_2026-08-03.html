<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hold On</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f7f4;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-family: Arial, sans-serif;
        }

        a {
            color: #555;
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: #333;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let ropeLength = 300;
        let knotPos;
        let sway;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            knotPos = createVector(width / 2, height / 3);
            sway = 0;
        }

        function draw() {
            clear();
            background('#f0f7f4');
            
            // Calculate sway effect
            sway = sin(frameCount * 0.02) * 100;

            // Draw Rope
            stroke('#835C3B');
            strokeWeight(6);
            line(width / 2 + sway, 0, width / 2 + sway, knotPos.y);
            
            // Draw Knot
            drawKnot(knotPos.x + sway, knotPos.y);
            
            // Draw Swinging Rope
            drawSwingingLines(knotPos.x + sway, knotPos.y + 20, 7);
        }

        function drawKnot(x, y) {
            fill('#A0522D');
            stroke('#5B3A1B');
            strokeWeight(2);
            ellipse(x, y, 40, 40);
        }

        function drawSwingingLines(x, startY, segments) {
            for (let i = 0; i < segments; i++) {
                let y1 = startY + i * (ropeLength / segments);
                let y2 = y1 + ropeLength / segments;
                let offset = sin((frameCount + i * 10) * 0.05) * 20;
                
                stroke('rgba(131, 92, 59, 0.9)');
                strokeWeight(8);
                line(x + offset, y1, x + offset, y2);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            knotPos = createVector(width / 2, height / 3);
        }
    </script>
</head>
<body>
    <div class="footer">
        <a href="https://www.beautyisapattern.com/archive" target="_blank">Visit the Archive</a>
    </div>
</body>
</html>
