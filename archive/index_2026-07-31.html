<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <title>Shadows & Sunshine Melody</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f7f1e3;
        }
        #archive {
            position: fixed;
            bottom: 15px;
            right: 20px;
            text-decoration: none;
            color: #ff6348;
            font-size: 12px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let sunPositionX, sunPositionY, sunRadius = 40;
        let angle = 0;
        let scaleRatio = 0.8;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
            sunPositionX = width / 2;
            sunPositionY = height / 4;
        }

        function draw() {
            background('#f7f1e3');

            drawSun();

            drawDynamicShadows();

            angle += 0.03;
        }

        function drawSun() {
            fill(255, 204, 0);
            ellipse(sunPositionX, sunPositionY, sunRadius * 2);
        }

        function drawDynamicShadows() {
            let shadowOffset = 200;

            for (let i = 0; i < 10; i++) {
                let influence = sin(angle + (i * 0.5)) * 50;
                let scaleValue = map(influence, -50, 50, 0.5, 1);
                let opac = map(scaleValue, 0.5, 1, 20, 80);
                let shadeX = sunPositionX + shadowOffset + (sin(angle + i) * shadowOffset * scaleRatio);
                let shadeY = height - (height / 7) - (abs(cos(angle + i) * shadowOffset/3));

                fill(`rgba(70, 70, 70, ${opac}%)`);
                ellipse(shadeX, shadeY, 150 * scaleValue, 60 * scaleValue);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <a id="archive" href="https://www.beautyisapattern.com/archive" target="_blank">View Archive</a>
</body>
</html>
