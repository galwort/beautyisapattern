<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Whispering energies of Silence</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        footer { position: absolute; bottom: 10px; width: 100%; text-align: center; }
        a { color: #fff; text-decoration: none; font-family: Arial, sans-serif; font-size: 14px; }
    </style>
</head>
<body>

<!-- Main Sketch -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script>
    let particles = [];
    const maxParticles = 100;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        for(let i = 0; i < maxParticles; i++) {
            particles.push(new Particle(random(width), random(height)));
        }
    }

    function draw() {
        background(26, 26, 26, 25);
        for (let p of particles) {
            p.update();
            p.edges();
            p.display();
        }
    }

    class Particle {
        constructor(x, y) {
            this.pos = createVector(x, y);
            this.vel = p5.Vector.random2D();
            this.acc = createVector(0, 0);
            this.lifespan = random(50, 200);
            this.size = random(5, 15);
            this.color = color(200, 200, 255, this.lifespan);
        }
        
        applyForce(force) {
            this.acc.add(force);
        }

        update() {
            this.vel.limit(2);
            this.vel.add(this.acc);
            this.pos.add(this.vel);
            this.acc.mult(0);

            // Damping
            this.vel.mult(0.95);
            
            // Reduce lifespan
            this.lifespan -= 1;
            this.color.setAlpha(this.lifespan);

            // Reset if expired
            if(this.lifespan < 0) {
                this.pos = createVector(random(width), random(height));
                this.lifespan = random(50, 200);
                this.size = random(5, 15);
                this.color.setAlpha(this.lifespan);
            }
        }

        display() {
            noStroke();
            fill(this.color);
            ellipse(this.pos.x, this.pos.y, this.size);
        }

        edges() {
            if (this.pos.x > width || this.pos.x < 0 ||
                this.pos.y > height || this.pos.y < 0) {

                // Redirect beyond bounds
                this.vel.mult(-1);
                this.lifespan *= 0.9; // Fast decay if hit borders
            }
        }
    }
</script>

</body>
</html>
