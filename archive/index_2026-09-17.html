<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Power of Belief</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            background-color: #111;
            overflow: hidden;
            color: whitesmoke;
            font-family: 'Arial', sans-serif;
        }
        a {
            color: #f0f0f0;
            text-decoration: none;
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 13px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <script>
        const particles = [];
        let centerX, centerY;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            centerX = width / 2;
            centerY = height / 2;
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle(random(width), random(height)));
            }
        }

        function draw() {
            background(0, 10);
            translate(centerX, centerY);

            particles.forEach(p => {
                p.update();
                p.render();
            });

            if (frameCount % 100 === 0) {
                particles.push(new Particle(random(width), random(height)));
                if (particles.length > 200) particles.shift();
            }
        }

        class Particle {
            constructor(x, y) {
                this.pos = createVector(x - centerX, y - centerY);
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.angle = random(TWO_PI);
                this.speedLimit = random(0.5, 2);
                this.radius = random(1, 8);
            }

            update() {
                let attraction = createVector(mouseX - centerX, mouseY - centerY);
                attraction.setMag(0.01);
                this.acc.add(attraction);

                this.acc.setMag(0.01);
                this.vel.add(this.acc);
                this.vel.limit(this.speedLimit);
                this.pos.add(this.vel);
                this.acc.mult(0);
            }

            render() {
                noStroke();
                fill(`rgba(${floor(150 + 105 * cos(this.angle))}, ${floor(150 + 105 * sin(this.angle))}, 200, 0.8)`);
                ellipse(this.pos.x, this.pos.y, this.radius);
                this.angle += 0.05;
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            centerX = width / 2;
            centerY = height / 2;
        }
    </script>
    <a href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
</body>
</html>
