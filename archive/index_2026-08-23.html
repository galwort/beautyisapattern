<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gathering Drops of Wisdom</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f4f8;
            overflow: hidden;
        }
        a {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #00796b;
            text-decoration: none;
            font-size: 16px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>

<a href="https://www.beautyisapattern.com/archive">Visit the Archive</a>

<script>
    let drops = [];
    let potY;
    let waterLevel = 0;
    let animationThreshold = 100;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        potY = height - 150;
        frameRate(30);
        noStroke();
    }

    function draw() {
        background('#f0f4f8');

        // Create new drop every few frames
        if (frameCount % 5 === 0 && waterLevel < 100) {
            const xPosition = random(width / 2 - 70, width / 2 + 70);
            drops.push(new Drop(xPosition, 0));
        }

        // Update and draw drops
        for (let i = drops.length - 1; i >= 0; i--) {
            drops[i].update();
            drops[i].display();

            // Remove drop if it reaches the pot
            if (drops[i].y >= potY) {
                drops.splice(i, 1);
                if (waterLevel < 100) {
                    waterLevel++;
                }
            }
        }

        drawPot();
    }

    class Drop {
        constructor(x, y) {
            this.x = x;
            this.y = y;
        }

        update() {
            this.y += 5;
        }

        display() {
            fill(64, 164, 223, 180);
            ellipse(this.x, this.y, 8, 8);
        }
    }

    function drawPot() {
        // Draw pot
        fill(139, 69, 19);
        arc(width / 2, potY + 75, 150, 150, PI, TWO_PI);

        // Draw incremental water increase
        if (waterLevel > 0) {
            fill(64, 164, 223, 150);
            arc(width / 2, potY + 75 - (waterLevel / 2), 150, waterLevel, PI, TWO_PI);
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        potY = height - 150;
    }
</script>

</body>
</html>
