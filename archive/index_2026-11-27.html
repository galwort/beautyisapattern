<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ephemeral Bonds</title>
  <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0f1b3d;
    }
    .archive-link {
      position: absolute;
      top: 0;
      right: 0;
      padding: 10px;
      color: #ffffff;
      font-size: 0.8em;
      text-decoration: none;
      font-family: 'Arial', sans-serif;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 5px;
    }
    .archive-link:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <script>
    let particles = [];
    let particlesLost = []; // Track particles that have disintegrated
    let particleCount = 100;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      noCursor();
      for(let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function draw() {
      background(15, 27, 61, 70);

      // Draw lines between particles that are still visible
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          let d = dist(particles[i].x, particles[i].y, particles[j].x, particles[j].y);
          if (d < 150) {
            stroke(255, 100);
            line(particles[i].x, particles[i].y, particles[j].x, particles[j].y);
          }
        }
      }

      // Update and display particles
      particles.forEach(particle => {
        particle.update();
        particle.show();
      });

      // Reduce visibility over time
      particles = particles.filter(p => !p.isLost());
    }

    class Particle {
      constructor() {
        this.x = random(width);
        this.y = random(height);
        this.vx = random(-0.5, 0.5);
        this.vy = random(-0.5, 0.5);
        this.alpha = 255; // Visibility
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;

        // Gradually decrease visibility
        this.alpha -= 0.5;
      }

      show() {
        noStroke();
        fill(255, 204, 0, this.alpha);
        ellipse(this.x, this.y, 8);
      }

      isLost() {
        return this.alpha <= 0;
      }
    }
  </script>
</head>
<body>
  <a href="https://www.beautyisapattern.com/archive" class="archive-link">Visit the Archive</a>
</body>
</html>
