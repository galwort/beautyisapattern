<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unseen Connections</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Arial', sans-serif;
        }
        .archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-decoration: none;
            color: #2980b9;
            font-size: 1.2em;
            transition: color 0.3s;
        }
        .archive-link:hover {
            color: #3498db;
        }
    </style>
</head>
<body>

<script>
    let particles = [];
    let numParticles = 200;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle(random(width), random(height)));
        }
    }

    function draw() {
        background(44, 62, 80, 25);

        particles.forEach(p => {
            p.move();
            p.display();
        });
    }

    class Particle {
        constructor(x, y) {
            this.pos = createVector(x, y);
            this.vel = p5.Vector.random2D().mult(random(0.5, 3));
            this.acc = createVector();
            this.maxSpeed = 2;
        }

        applyForce(force) {
            this.acc.add(force);
        }

        move() {
            let perlin = noise(this.pos.x * 0.01, this.pos.y * 0.01) * TWO_PI * 2;
            let steer = p5.Vector.fromAngle(perlin);
            steer.setMag(0.1);
            this.applyForce(steer);

            this.vel.add(this.acc);
            this.vel.limit(this.maxSpeed);
            this.pos.add(this.vel);
            this.acc.mult(0);

            this.edges();
        }

        edges() {
            if (this.pos.x > width) this.pos.x = 0;
            if (this.pos.x < 0) this.pos.x = width;
            if (this.pos.y > height) this.pos.y = 0;
            if (this.pos.y < 0) this.pos.y = height;
        }

        display() {
            noStroke();
            fill(236, 240, 241, 80);
            ellipse(this.pos.x, this.pos.y, 4);
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>

<a href="https://www.beautyisapattern.com/archive" class="archive-link">Explore the Archive</a>

</body>
</html>
