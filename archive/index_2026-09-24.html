<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <title>Embrace the Impossible</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #282C34;
            overflow: hidden;
        }
        a {
            color: white;
            position: absolute;
            bottom: 20px;
            text-decoration: none;
            font-size: 18px;
        }
    </style>
</head>
<body>

<a href="https://www.beautyisapattern.com/archive">Explore the Archive</a>

<script>
    let t = 0; // Time variable to drive the animation

    function setup() {
        createCanvas(windowWidth, windowHeight);
        noFill();
    }

    function draw() {
        background(40, 44, 52, 30);
        translate(width / 2, height / 2);

        // Drawing the swirling wave pattern
        for (let i = 0; i < 20; i++) {
            stroke(`rgba(${floor(200 + 55 * sin(i + t))}, ${floor(150 + 105 * sin(i + t))}, ${255}, 0.6)`);
            strokeWeight(1.5);
            push();
            rotate(i + t);
            beginShape();
            // Loop to create curves that form spiral-like waves
            for (let j = 0; j < 12; j++) {
                let x = map(sin(j * PI / 6 + t + i), -1, 1, -300, 300);
                let y = map(cos(j * PI / 6 + t + i), -1, 1, -300, 300);
                vertex(x/2, y/2);
            }
            endShape(CLOSE);
            pop();
        }

        t += 0.015; // Increment time variable to create animation
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>

</body>
</html>
