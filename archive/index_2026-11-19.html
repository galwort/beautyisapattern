<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Journey Through Now and Then</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon" />
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
        }
        .archive-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #efefef;
            text-decoration: none;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .archive-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
        }

        function draw() {
            background(17, 17, 34);
            translate(width / 2, height / 2);
            let totalCirc = 6;
            let time = millis() / 1000;
            
            for (let i = 0; i < 360; i += 36) {
                let angle = radians(i + (time * 20) % 360);
                let size = map(sin(time + i), -1, 1, 80, 150);

                let x = cos(angle) * (200 + 50 * cos(time));
                let y = sin(angle) * (200 + 50 * sin(time));

                let r = map(sin(angle + time), -1, 1, 150, 255);
                let g = map(cos(angle + time), -1, 1, 70, 200);
                let b = map(sin(2 * angle + time), -1, 1, 150, 255);

                fill(r, g, b, 180);
                ellipse(x, y, size, size);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <a class="archive-link" href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
</body>
</html>
