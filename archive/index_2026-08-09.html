<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metamorphosis of Thought</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0D0D0D;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        a {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #00bfa5;
            text-decoration: none;
            transition: 0.3s;
        }
        a:hover {
            color: #80cbc4;
        }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let butterflies = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < 10; i++) {
                butterflies.push(new Butterfly(random(width), random(height)));
            }
        }

        function draw() {
            background(13, 13, 13, 100);
            
            for (let butterfly of butterflies) {
                butterfly.update();
                butterfly.show();
            }
        }

        class Butterfly {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = createVector(random(-2, 2), random(-2, 2));
                this.size = random(20, 60);
                this.angle = 0;
                this.color = color(random(100, 255), random(100, 255), random(100, 255), 150);
            }

            update() {
                this.pos.add(this.vel);
                this.angle += 0.05;

                if (this.pos.x > width || this.pos.x < 0) {
                    this.vel.x *= -1;
                }
                if (this.pos.y > height || this.pos.y < 0) {
                    this.vel.y *= -1;
                }
            }

            show() {
                push();
                translate(this.pos.x, this.pos.y);
                rotate(sin(this.angle));
                fill(this.color);
                stroke(255);
                strokeWeight(1);

                // Draw a simple abstract butterfly
                beginShape();
                vertex(0, 0);
                bezierVertex(-this.size / 2, -this.size / 4, -this.size, this.size / 2, 0, this.size);
                bezierVertex(this.size, this.size / 2, this.size / 2, -this.size / 4, 0, 0);
                endShape(CLOSE);
                pop();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

    <a href="https://www.beautyisapattern.com/archive">Explore More Patterns</a>

</body>
</html>
