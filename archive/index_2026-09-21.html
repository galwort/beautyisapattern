<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythms of Stillness</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f4f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        #archive-link {
            position: absolute;
            bottom: 10px;
            font-size: 1rem;
            color: #444;
            text-decoration: none;
            transition: color 0.3s;
        }
        #archive-link:hover {
            color: #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
</head>
<body>
    <script>
        let waves = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noFill();
            strokeWeight(2);
            
            for (let i = 0; i < 5; i++) {
                waves.push(new Wave(i * 20 + 100, i % 2 === 0));
            }
        }

        function draw() {
            background(244, 247, 247, 100);
            translate(width / 2, height / 2);
            for (let wave of waves) {
                wave.update();
                wave.show();
            }
        }

        class Wave {
            constructor(radius, clockwise) {
                this.angle = 0;
                this.radius = radius;
                this.clockwise = clockwise ? 1 : -1;
                this.speed = random(0.002, 0.004);
                this.color = lerpColor(color('#8EC5FC'), color('#E0C3FC'), random(1));
            }

            update() {
                this.angle += this.clockwise * this.speed;
            }

            show() {
                stroke(this.color);
                beginShape();
                for (let a = 0; a < TWO_PI; a += 0.01) {
                    let x = this.radius * cos(a + this.angle);
                    let y = this.radius * sin(a + this.angle);
                    vertex(x, y);
                }
                endShape(CLOSE);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

    <a id="archive-link" href="https://www.beautyisapattern.com/archive">Explore Our Archive</a>
</body>
</html>
