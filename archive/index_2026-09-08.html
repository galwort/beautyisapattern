<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaching Beyond Limits</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        #archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ddd;
            font-size: 14px;
            text-decoration: none;
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        #archive-link:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive">Explore the Archive</a>

    <script>
        let t = 0;

        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('canvas-container');
            noFill();
            frameRate(30);
            
        }

        function draw() {
            background(34, 34, 34, 25);
            translate(width / 2, height / 2); // Center the drawings

            // Humans represented by a yellow triangle orbiting
            stroke('rgba(255, 204, 0, 0.7)');
            strokeWeight(2);
            let humanRadius = 150;
            let humanX = cos(t) * humanRadius;
            let humanY = sin(t) * humanRadius;
            triangle(humanX, humanY, humanX + 20, humanY - 30, humanX + 40, humanY);

            // God-like essence as radiant abstract shapes
            stroke('rgba(30, 144, 255, 0.5)');
            strokeWeight(4);
            for (let i = 0; i < TAU; i += PI / 4) {
                push();
                rotate(t + i);
                star(0, 0, 50, 100 * noise(t), 5);
                pop();
            }

            t += 0.01; // Increment time
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        // Custom star function to create star-like shape
        function star(x, y, radius1, radius2, npoints) {
            let angle = TWO_PI / npoints;
            let halfAngle = angle / 2.0;
            beginShape();
            for (let a = 0; a < TWO_PI; a += angle) {
                let sx = x + cos(a) * radius2;
                let sy = y + sin(a) * radius2;
                vertex(sx, sy);
                sx = x + cos(a + halfAngle) * radius1;
                sy = y + sin(a + halfAngle) * radius1;
                vertex(sx, sy);
            }
            endShape(CLOSE);
        }

    </script>
</body>
</html>
