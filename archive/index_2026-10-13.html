<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Sanctuary</title>
    <link rel="shortcut icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/p5/lib/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        #archive-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive" target="_blank">Visit Archive</a>
    
    <script>
        let particles = [];
        let centerX, centerY;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            centerX = width / 2;
            centerY = height / 2;
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle(random(width), random(height)));
            }
        }

        function draw() {
            background(17, 17, 17, 25);
            for (let particle of particles) {
                particle.update();
                particle.show();
            }
        }

        class Particle {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = p5.Vector.random2D();
                this.acc = createVector();
                this.maxSpeed = 2;
            }

            update() {
                let target = createVector(centerX, centerY);
                let force = p5.Vector.sub(target, this.pos);
                force.setMag(0.05);
                this.acc = force;

                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);

                if (this.pos.x > width + 10 || this.pos.x < -10 ||
                    this.pos.y > height + 10 || this.pos.y < -10) {
                    this.pos = createVector(random(width), random(height));
                }
            }

            show() {
                fill(255, 255, 255);
                ellipse(this.pos.x, this.pos.y, 5, 5);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            centerX = width / 2;
            centerY = height / 2;
        }
    </script>
</body>
</html>
