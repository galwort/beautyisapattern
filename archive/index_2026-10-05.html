<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
  <title>Veils of Consciousness</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #archive-link {
      position: absolute;
      bottom: 10px;
      right: 10px;
      color: #ffffff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      text-decoration: none;
    }

    #archive-link:hover {
      text-decoration: underline;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <script>
    let particles = [];

    function setup() {
      createCanvas(windowWidth, windowHeight);
      for (let i = 0; i < 200; i++) {
        particles.push(new Particle());
      }
    }

    function draw() {
      background(18, 18, 18, 25);

      for (let i = 0; i < particles.length; i++) {
        particles[i].move();
        particles[i].show();
      }
    }

    class Particle {
      constructor() {
        this.x = random(width);
        this.y = random(height);
        this.size = random(5, 25);
        this.alpha = random(50, 150);
        this.xSpeed = random(-1, 1);
        this.ySpeed = random(-1, 1);
        this.noiseOffsetX = random(1000);
        this.noiseOffsetY = random(2000);
      }

      move() {
        this.x += this.xSpeed * noise(this.noiseOffsetX);
        this.y += this.ySpeed * noise(this.noiseOffsetY);
        this.noiseOffsetX += 0.01;
        this.noiseOffsetY += 0.01;

        if (this.x < 0 || this.x > width) { this.xSpeed *= -1; }
        if (this.y < 0 || this.y > height) { this.ySpeed *= -1; }
      }

      show() {
        noStroke();
        fill(250, 255, 220, this.alpha);
        ellipse(this.x, this.y, this.size);
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</head>
<body>
  <a id="archive-link" href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
</body>
</html>
