<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veil of Illusions</title>
    <link rel="icon" type="image/x-icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #20232a;
        }
        a {
            position: fixed;
            bottom: 10px;
            right: 10px;
            text-decoration: none;
            color: #61dafb;
            font-size: 16px;
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script>
    let circles = [];

    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        for (let i = 0; i < 50; i++) {
            circles.push(new CircleParticle(random(width), random(height)));
        }
    }

    function draw() {
        background(32, 35, 42, 25); // Dim background with slight trail effect
        circles.forEach(circle => {
            circle.update();
            circle.display();
        });
    }

    class CircleParticle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.baseSize = random(15, 30);
            this.size = this.baseSize;
            this.angleSpeed = random(0.01, 0.05);
            this.color = randomColor();
            this.angle = random(TWO_PI);
        }

        update() {
            this.size = this.baseSize + sin(this.angle) * 5; // Pulsing effect
            this.angle += this.angleSpeed;                   // Rotate slowly
            this.x += sin(this.angle) * 2;
            this.y += cos(this.angle) * 2;
            // Screen wrapping
            if (this.x > width) this.x = 0;
            if (this.x < 0) this.x = width;
            if (this.y > height) this.y = 0;
            if (this.y < 0) this.y = height;
        }

        display() {
            fill(this.color);
            ellipse(this.x, this.y, this.size);
        }
    }

    function randomColor() {
        let r = floor(random(100, 255));
        let g = floor(random(100, 255));
        let b = floor(random(100, 255));
        return color(r, g, b, 150);
    }
</script>

<a href="https://www.beautyisapattern.com/archive">Explore the Archive</a>

</body>
</html>
