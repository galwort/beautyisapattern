<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Light Journey</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #131313;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        a {
            position: absolute;
            bottom: 15px;
            right: 15px;
            color: #ccc;
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <script>
        let points = [];
        let theta = 0;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < 100; i++) {
                points.push(new Point(random(width), random(height)));
            }
            noStroke();
        }

        function draw() {
            background(19);
            theta += 0.01;

            let centerX = width / 2;
            let centerY = height / 2;

            for (let i = 0; i < points.length; i++) {
                let pt = points[i];
                let wave = sin(theta + pt.offset) * 50;
                let angle = atan2(pt.y - centerY, pt.x - centerX);

                pt.x += cos(angle) * wave;
                pt.y += sin(angle) * wave;

                fill(map(wave, -50, 50, 180, 255), 230, 255, 150);
                ellipse(pt.x, pt.y, 12, 12);
            }
        }

        class Point {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.offset = random(0, TWO_PI);
            }
        }
    </script>

    <a href="https://www.beautyisapattern.com/archive">View Archive</a>
</body>
</html>
