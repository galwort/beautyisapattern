<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symphony of Trust</title>
  <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      background-color: #e8f1f6;
      font-family: Arial, sans-serif;
    }
    footer {
      text-align: center;
      padding: 1rem;
      background-color: #dde7ec;
    }
    footer a {
      color: #2c3e50;
      text-decoration: none;
      font-size: 1.1rem;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <script>
    let particles = [];
    const numParticles = 150;
    const maxConnectionDist = 150;

    function setup() {
      createCanvas(window.innerWidth, window.innerHeight);
      for (let i = 0; i < numParticles; i++) {
        particles.push(new Particle(random(width), random(height)));
      }
    }

    function draw() {
      background(232, 241, 246, 175);
      noStroke();
      for (let particle of particles) {
        particle.update();
        particle.display();
      }
      drawConnections();
    }

    function drawConnections() {
      strokeWeight(1);
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          let distance = dist(particles[i].x, particles[i].y, particles[j].x, particles[j].y);
          if (distance < maxConnectionDist) {
            stroke(map(distance, 0, maxConnectionDist, 170, 50), 100);
            line(particles[i].x, particles[i].y, particles[j].x, particles[j].y);
          }
        }
      }
    }

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.r = random(2, 4);
        this.xSpeed = random(-1.5, 1.5);
        this.ySpeed = random(-1.5, 1.5);
      }

      update() {
        this.x += this.xSpeed;
        this.y += this.ySpeed;
        this.bounce();
      }

      bounce() {
        if (this.x < 0 || this.x > width) this.xSpeed *= -1;
        if (this.y < 0 || this.y > height) this.ySpeed *= -1;
      }

      display() {
        fill(44, 62, 80);
        ellipse(this.x, this.y, this.r * 2);
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>

  <footer>
    <a href="https://www.beautyisapattern.com/archive" target="_blank">Explore The Archive</a>
  </footer>
</body>
</html>
