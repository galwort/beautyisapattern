<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <title>The Elegance of Understanding</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #101010;
        }

        .link-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
        }

        a {
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-decoration: none;
            background-color: #ff6f61;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #ff8c80;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>

    <div class="link-container"><a href="https://www.beautyisapattern.com/archive">Explore Timeless Patterns</a></div>

    <script>
        let angle = 0;
        let colors = ['#ff6f61', '#ffd700', '#32cd32', '#1e90ff', '#ff69b4'];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noFill();
        }

        function draw() {
            background(16);
            translate(width / 2, height / 2);
            rotate(angle * 0.5);
            strokeWeight(1.5);

            for (let i = 0; i < 20; i++) {
                stroke(colors[i % colors.length]);
                let radius = map(sin(angle + i), -1, 1, 100, 400);
                bezierCircle(radius);
                rotate(TWO_PI / 20);
            }

            angle += 0.01;
        }

        function bezierCircle(r) {
            beginShape();
            for (let a = 0; a < TWO_PI; a += PI / 8) {
                let x = r * cos(a) + random(-10, 10);
                let y = r * sin(a) + random(-10, 10);
                vertex(x, y);
            }
            endShape(CLOSE);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

</body>
</html>
