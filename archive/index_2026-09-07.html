<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Darkness to Light</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #141414;
            color: #fafafa;
            font-family: 'Courier New', Courier, monospace;
        }
        #archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #fafafa;
            text-decoration: none;
        }
        #archive-link:hover {
            color: #ff9900;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <script>
        let particles = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < 200; i++) {
                particles.push(new Particle(random(width), random(height)));
            }
        }

        function draw() {
            background(14, 14, 20, 50);  // Soft dark background creating a shadowy effect
            for (let p of particles) {
                p.update();
                p.show();
            }
            glow();
        }

        function glow() {
            noFill();
            stroke(255, 204, 0, 50);
            strokeWeight(8);
            ellipse(width / 2, height / 2, 200, 200);
        }

        class Particle {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.angle = random(TWO_PI);
                this.radialDistance = random(50, 150);
                this.orbitTime = 0;
                this.color = color(255, 204, random(100, 255));
            }

            update() {
                this.orbitTime += 0.01;
                this.pos.x = width / 2 + cos(this.angle + this.orbitTime) * this.radialDistance;
                this.pos.y = height / 2 + sin(this.angle + this.orbitTime) * this.radialDistance;
            }

            show() {
                noStroke();
                fill(this.color);
                ellipse(this.pos.x, this.pos.y, 6, 6);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
</body>
</html>
