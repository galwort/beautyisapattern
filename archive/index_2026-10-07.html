<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony of Hearts</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0e3ff;
            overflow: hidden;
        }
        #archive-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            text-decoration: none;
            color: #4a4e69;
            font-family: 'Garamond', serif;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        const hearts = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
            for (let i = 0; i < 20; i++) {
                hearts.push(new Heart(random(width), random(height), random(0.3, 0.8)));
            }
        }

        function draw() {
            background(240, 227, 255, 60);
            for (let heart of hearts) {
                heart.move();
                heart.display();
            }
        }

        class Heart {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.angle = random(TWO_PI);
                this.speed = 0.5;
            }

            move() {
                this.x += cos(this.angle) * this.speed;
                this.y += sin(this.angle) * this.speed;

                if (this.x < 0 || this.x > width) {
                    this.angle = PI - this.angle;
                }

                if (this.y < 0 || this.y > height) {
                    this.angle = TWO_PI - this.angle;
                }
            }

            display() {
                push();
                translate(this.x, this.y);
                scale(this.size);
                beginShape();
                fill(204, 92, 92, 180);
                vertex(0, -26);
                bezierVertex(-12, -40, -28, -22, 0, -10);
                bezierVertex(28, -22, 12, -40, 0, -26);
                bezierVertex(-18, -10, -28, 18, 0, 30);
                bezierVertex(28, 18, 18, -10, 0, -26);
                endShape(CLOSE);
                pop();
            }
        }

    </script>
</head>
<body>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
</body>
</html>
