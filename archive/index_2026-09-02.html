<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growing Journeys</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #fafafa;
        }
        a {
            margin-top: 20px;
            text-decoration: none;
            color: #fafafa;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #ff69b4;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        const numCircles = 10;
        let circles = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < numCircles; i++) {
                let newCircle = {
                    x: random(width),
                    y: random(height),
                    size: random(5, 20),
                    grow: true
                };
                circles.push(newCircle);
            }
            stroke(255, 100);
            strokeWeight(1);
            noFill();
        }

        function draw() {
            background(30, 30, 50);

            circles.forEach(c => {
                c.size += c.grow ? 0.2 : -0.2;
                if (c.size > 100) c.grow = false;
                if (c.size < 5) c.grow = true;

                let alpha = map(c.size, 5, 100, 50, 255);
                stroke(255, alpha);
                ellipse(c.x, c.y, c.size);
            });
        }
    </script>
    <a href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
</body>
</html>
