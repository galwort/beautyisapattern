<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflections of Perception</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f3f4f6;
        }
        .archive-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            text-decoration: none;
            color: #3366cc;
            font-size: 14px;
            z-index: 9999;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let colors;
        function setup() {
            createCanvas(windowWidth, windowHeight);
            colors = [
                color(0, 191, 255, 150),
                color(255, 74, 102, 150),
                color(255, 196, 0, 150),
                color(207, 255, 27, 150),
                color(102, 255, 178, 150),
                color(178, 102, 255, 150)
            ];
            noStroke();
        }

        function draw() {
            // Semi-transparent background for trail effect
            background(243, 244, 246, 75);
            let time = millis() * 0.001;

            // Rotating concentric arcs
            for (let i = 0; i < colors.length; i++) {
                push();
                translate(width / 2, height / 2);
                rotate(TWO_PI * (i / colors.length) + time / 4);
                fill(colors[i]);
                arc(0, 0, 300, 300, PI * i / (colors.length / 2), PI * (i + 1) / (colors.length / 2), PIE);
                pop();
            }

            // Dynamic, pulsating circles
            for (let i = 0; i < 30; i++) {
                let x = noise(i, time) * width;
                let y = noise(i, time + 1000) * height;
                let size = sin(time + i) * 50 + 50;
                fill(colors[(i + int(time)) % colors.length]);
                ellipse(x, y, size, size);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <a href="https://www.beautyisapattern.com/archive" class="archive-link">Explore the Archive</a>
</body>
</html>
