<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metamorphosis Unveiled</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: linear-gradient(135deg, #e8e3d8, #fdfdfd);
      }
      .archive-link {
        position: absolute;
        bottom: 20px;
        right: 20px;
        font-family: 'Source Sans Pro', sans-serif;
        font-size: 16px;
        color: #555;
        text-decoration: none;
        transition: color 0.2s ease;
      }
      .archive-link:hover {
        color: #000;
      }
    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
      let entities = [];
      let caterpillarsCount = 3;
      let metamorphosisAge = 200;

      function setup() {
        createCanvas(windowWidth, windowHeight);
        for (let i = 0; i < caterpillarsCount; i++) {
          entities.push(new Caterpillar(random(width), random(height)));
        }
      }

      function draw() {
        background(232, 227, 216);
        for (let i = entities.length - 1; i >= 0; i--) {
          entities[i].update();
          entities[i].display();
          if (entities[i].age > metamorphosisAge) {
            entities.splice(i, 1);
            entities.push(new Butterfly(random(width), random(height)));
          }
        }
      }

      class Caterpillar {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.size = random(20, 50);
          this.age = 0;
          this.segments = floor(random(5, 10));
        }

        update() {
          this.x += random(-1, 1);
          this.y += random(-1, 1);
          this.age++;
        }

        display() {
          stroke(50, 200, 50);
          strokeWeight(3);
          noFill();
          for (let i = 0; i < this.segments; i++) {
            ellipse(this.x + i * 8, this.y + sin(frameCount * 0.1 + i) * 5, this.size, this.size / 2);
          }
        }
      }

      class Butterfly {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.size = random(30, 60);
          this.angle = 0;
        }

        update() {
          this.angle += 0.05;
          this.x += sin(this.angle) * 2;
          this.y += cos(this.angle) * 1.5;
        }

        display() {
          noStroke();
          fill(250, 140, 200, 150);
          push();
          translate(this.x, this.y);
          rotate(sin(frameCount * 0.15) * PI / 8);
          ellipse(0, -15, this.size, this.size / 2);
          ellipse(0, 15, this.size, this.size / 2);
          pop();
        }
      }
    </script>
    <a href="https://www.beautyisapattern.com/archive" class="archive-link">Explore the Archive</a>
  </body>
</html>
