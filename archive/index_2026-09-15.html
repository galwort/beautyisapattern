<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Serenity</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #90e0ef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        footer {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #023047;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
        }

        a {
            text-decoration: none;
            color: #0077b6;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <script>
        let floaters = [];
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            // Creating floating circles
            for (let i = 0; i < 50; i++) {
                floaters.push(new Floater(random(width), random(height)));
            }
        }

        function draw() {
            background(144, 224, 239);
            for (let floater of floaters) {
                floater.move();
                floater.display();
            }
        }

        class Floater {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = createVector(random(-1, 1), random(0.5, 1));
                this.size = random(10, 30);
                this.color = color(2, 48, 74, 200);
            }

            move() {
                this.pos.add(this.vel);

                // Loop around screen
                if (this.pos.y > height) this.pos.y = 0;
                if (this.pos.x > width) this.pos.x = 0;
                if (this.pos.x < 0) this.pos.x = width;
            }

            display() {
                fill(this.color);
                noStroke();
                ellipse(this.pos.x, this.pos.y, this.size);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <footer>
        <a href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
    </footer>
</body>
</html>
