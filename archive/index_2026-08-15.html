<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <title>The Cycle of Time</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(120deg, #0d0d0d, #434343);
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-decoration: none;
            color: #eaeaea;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        #archive-link:hover {
            background-color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

<div id="sketch-container"></div>
<a id="archive-link" href="https://www.beautyisapattern.com/archive">Explore the Archive</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script>
    let dots = [];
    let numDots = 8;

    function setup() {
        let canvas = createCanvas(windowWidth, windowHeight);
        canvas.parent('sketch-container');
        for (let i = 0; i < numDots; i++) {
            dots.push(new Dot(width / 2, height / 2));
        }
        frameRate(30);
    }

    function draw() {
        background(13, 13, 13, 50);
        displayDots();
        for (let dot of dots) {
            dot.move();
        }
    }

    function displayDots() {
        push();
        translate(width / 2, height / 2);
        noFill();
        for (let i = 0; i < 100; i++) {
            stroke(200, 200, 240, 120 - i / 2);
            ellipse(0, 0, 10 * i, 10 * i);
        }
        pop();
    }

    class Dot {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.angle = random(TWO_PI);
            this.radius = random(150, 300);
            this.speed = random(0.01, 0.03);
        }

        move() {
            this.angle += this.speed;
            this.x = width / 2 + this.radius * cos(this.angle);
            this.y = height / 2 + this.radius * sin(this.angle);
            fill(255, 100);
            noStroke();
            ellipse(this.x, this.y, 8, 8);
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>

</body>
</html>
