<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifest Greatness</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #f3f3f3, #d0e3f0);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        #archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
            transition: color 0.3s;
        }
        #archive-link:hover {
            color: #222;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let t = 0;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            stroke(255, 100);
            strokeWeight(2);
        }

        function draw() {
            background('rgba(0, 0, 0, 0.05)');
            translate(width / 2, height / 2);

            for (let i = 0; i < 5; i++) {
                rotate(sin(t + i) / 5);
                let hue = map(sin(t + i), -1, 1, 0, 255);
                stroke(`hsla(${hue}, 75%, 50%, 0.6)`);
                line(0, 0, width * 0.2, height * 0.2);
                ellipse(0, 0, 600, 100);
                scale(0.95);
            }
            t += 0.005;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive">Explore the archive</a>
</body>
</html>
