<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illusions of Perception</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body, html {
            margin: 0;
            overflow: hidden;
            background: #20232a; /* slightly more vibrant dark color */
        }
        footer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #61dafb; /* vibrant complementary color */
            font-family: 'Courier New', Courier, monospace; /* to give a distinct look */
        }
        footer a {
            color: #ffcc00;
            text-decoration: none;
        }
    </style>
</head>
<body>

<script>
    let w, h;

    function setup() {
        w = windowWidth;
        h = windowHeight;
        createCanvas(w, h);
        noStroke();
        fill(259); /* White color for illusion effect */
        ellipseMode(RADIUS);
        frameRate(30);
    }

    function draw() {
        background(32, 35, 42, 50); /* Semi-transparent fade effect */
        let time = millis() * 0.001;

        // Parameters for the illusion
        let count = 15;
        let waveAmp = map(mouseX, 0, width, 8, 50);
        let freq = map(mouseY, 0, height, 0.5, 3);

        // Nested loops for pattern
        for (let x = width / count; x < width; x += width / count) {
            for (let y = height / count; y < height; y += height / count) {
                let offsetX = x + waveAmp * sin(freq * (x + time));
                let offsetY = y + waveAmp * cos(freq * (y + time));
                stroke(255);
                line(offsetX, y, x, offsetY);
                line(x, offsetY, offsetX, y);
            }
        }
    }

    function windowResized() {
        w = windowWidth;
        h = windowHeight;
        resizeCanvas(w, h);
    }
</script>

<footer>
    Browse the <a href="https://www.beautyisapattern.com/archive" target="_blank">archive</a> for more patterns.
</footer>

</body>
</html>
