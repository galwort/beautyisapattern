<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convergence of Possibilities</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #1e1e2f;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .archive-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-family: Arial, sans-serif;
            color: #ffffffaa;
            font-size: 0.9rem;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.0/lib/p5.js"></script>
    <script>
        let stars = [];
        let numStars = 150;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function draw() {
            background(30, 30, 47);
            for (let star of stars) {
                star.update();
                star.show();
            }
        }

        class Star {
            constructor() {
                this.x = random(-width, width);
                this.y = random(-height, height);
                this.z = random(width);
                this.pz = this.z;
            }

            update() {
                this.z -= map(mouseX, 0, width, 4, 7);
                if (this.z < 1) {
                    this.z = width;
                    this.x = random(-width, width);
                    this.y = random(-height, height);
                    this.pz = this.z;
                }
            }

            show() {
                fill(255);
                noStroke();

                let sx = map(this.x / this.z, 0, 1, 0, width);
                let sy = map(this.y / this.z, 0, 1, 0, height);

                let r = map(this.z, 0, width, 12, 0);
                ellipse(sx, sy, r, r);

                let px = map(this.x / this.pz, 0, 1, 0, width);
                let py = map(this.y / this.pz, 0, 1, 0, height);

                this.pz = this.z;

                stroke(255);
                line(px, py, sx, sy);
            }
        }
    </script>
</head>
<body>
    <div class="archive-link">
        <a href="https://www.beautyisapattern.com/archive" target="_blank" style="text-decoration: none; color: inherit;">Visit the Archive</a>
    </div>
</body>
</html>
