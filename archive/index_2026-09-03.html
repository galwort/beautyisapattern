<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embrace the Power Within</title>
    <link rel="icon" type="image/x-icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
      body {
        background-color: #1e1e1e;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        color: #f7f7f7;
        font-family: Arial, sans-serif;
      }

      a {
        color: #ff6347;
        position: absolute;
        bottom: 20px;
        right: 20px;
        text-decoration: none;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
      let circles = [];
      let maxSize = 50;

      function setup() {
        createCanvas(windowWidth, windowHeight);
        for (let i = 0; i < 100; i++) {
          circles.push(new Circle(random(width), random(height)));
        }
      }

      function draw() {
        background(30, 30, 30, 30);
        for (let circle of circles) {
          circle.move();
          circle.display();
        }
      }

      class Circle {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.size = random(5, 15);
          this.xSpeed = random(-2, 2);
          this.ySpeed = random(-2, 2);
          this.expansion = true;
        }

        move() {
          this.x += this.xSpeed;
          this.y += this.ySpeed;

          if (this.x < 0 || this.x > width) {
            this.xSpeed *= -1;
          }
          if (this.y < 0 || this.y > height) {
            this.ySpeed *= -1;
          }

          this.size = this.expansion ? this.size + 0.2 : this.size - 0.2;
          if (this.size > maxSize || this.size < 5) {
            this.expansion = !this.expansion;
          }
        }

        display() {
          noStroke();
          fill(135, 206, 250, 200);
          ellipse(this.x, this.y, this.size);
        }
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>

    <a href="https://www.beautyisapattern.com/archive" target="_blank">Visit the Archive</a>
  </body>
</html>
