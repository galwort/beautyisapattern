<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embracing the Future</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #0C243A;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #89CFF0;
      }
      .archive-link {
        position: absolute;
        bottom: 20px;
        right: 20px;
        color: #89CFF0;
        text-decoration: none;
        font-family: 'Arial', sans-serif;
        font-size: 0.9rem;
      }
      .archive-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <script>
      let pastLines = [];
      let futureCircles = [];
      let waveAmplitude = 0;

      function setup() {
        createCanvas(windowWidth, windowHeight);
        noFill();
        strokeWeight(2);
        setInterval(() => {
          pastLines.push(createVector(random(width), height, random(0, 255)));
          if (pastLines.length > 15) pastLines.splice(0, 1);
        }, 1000);
        setInterval(() => {
          futureCircles.push({
            pos: createVector(random(width), random(height / 2, height)),
            r: 1
          });
          if (futureCircles.length > 50) futureCircles.splice(0, 1);
        }, 500);
      }

      function draw() {
        background(12, 36, 58, 15);
        
        // Animate past lines
        stroke(137, 207, 240, 150);
        pastLines.forEach((line) => {
          stroke(line.z, 100, 150, 100);
          line.y -= 1.5;
          line(line.x, line.y, line.x, line.y - 200);
          if (line.y < 0) line.y = height;
        });

        // Animate future circles
        stroke(200, 238, 255, 200);
        futureCircles.forEach((circle) => {
          circle.r += 0.5;
          ellipse(circle.pos.x, circle.pos.y - sin(frameCount * 0.02 + circle.pos.x) * 20, circle.r);
        });

        // Future wave
        waveAmplitude = sin(frameCount * 0.05) * 50;
        stroke(255, 255, 255, 150);
        beginShape();
        for (let x = 0; x < width; x += 10) {
          let y = height / 2 + waveAmplitude * sin(TWO_PI * x / width + frameCount * 0.01);
          vertex(x, y);
        }
        endShape();
      }
    </script>
    <a class="archive-link" href="https://www.beautyisapattern.com/archive" target="_blank">Explore the Archive</a>
  </body>
</html>
