<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Courage to Choose</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        .archive-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-family: Arial, sans-serif;
            font-size: 0.9em;
            color: #bbb;
            text-decoration: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let angle = 0;
        let radius;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            radius = min(width, height) / 3;
            noFill();
            strokeWeight(2);
            stroke(255, 204, 0);
        }

        function draw() {
            background(34);
            push();
            translate(width / 2, height / 2);
            rotate(angle);

            for (let i = 0; i < 8; i++) {
                let d = map(i, 0, 7, radius / 2, radius);
                let start = PI / 4 * i;
                let end = start + PI / 3;
                arc(0, 0, d * 2, d * 2, start, end);
                arc(0, 0, d * 2, d * 2, start + PI, end + PI);
            }

            pop();

            angle += 0.01;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <a href="https://www.beautyisapattern.com/archive" class="archive-link">Visit the Archive</a>
</body>
</html>
