<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflections of Business</title>
  <link rel="icon" type="image/x-icon" href="https://www.beautyisapattern.com/favicon.ico">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #eef;
    }

    a {
      position: absolute;
      bottom: 20px;
      text-decoration: none;
      color: #335;
      font-family: Arial, sans-serif;
    }

    canvas {
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>
  <script>
    function setup() {
      createCanvas(windowWidth * 0.9, windowHeight * 0.8);
      noStroke();
      smooth();
    }

    function draw() {
      background(200, 220, 255);

      // Dynamic environment variables
      let t = frameCount * 0.02;
      let horizonY = height * 0.55;

      // Animate car path as an oscillation
      let carY = map(sin(t), -1, 1, horizonY + 5, horizonY + 20);

      // Windshield gradient
      for(let i = height - 100; i < height; i++) {
        let alpha = map(i, height - 100, height, 120, 0);
        stroke(255, 255, 255, alpha);
        line(0, i, width, i);
      }

      // Draw road perspective lines
      stroke(220, 255, 255, 100);
      strokeWeight(3);
      for (let x = 0; x < width; x += 30) {
        line(width / 2, carY + 50, x, height);
      }

      // Draw rearview mirror like a lens reflection
      drawRearview();

      // Windshield reiteration: Dynamic clarity line
      stroke(243, 100, 133);
      strokeWeight(8);
      line(width / 2 - 150, horizonY - 20, width / 2 + 150, horizonY - 20);
    }

    function drawRearview() {
      stroke(50, 50, 70);
      fill(190, 200, 200);

      // Center mirror slightly left, reflecting a broad view
      let mirrorX = width * 0.25;
      let mirrorY = height * 0.35;
      ellipse(mirrorX, mirrorY, 250, 150);

      // Animated backward path
      stroke(150);
      strokeWeight(2);
      for (let x = width / 2 - 100; x <= width / 2 + 100; x += 20) {
        line(mirrorX, mirrorY, x, height);
      }
    }
  </script>
  <a href="https://www.beautyisapattern.com/archive">Visit the Archive</a>
</body>

</html>
