<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Void to Form</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #202124;
            position: relative;
        }
        a#archive-link {
            position: absolute;
            bottom: 20px;
            left: 20px;
            text-decoration: none;
            color: #d6d6d6;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        a#archive-link:hover {
            color: #ffffff;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let particles = []; // Stores the particles created
        let maxParticles = 200; // Maximum number of particles

        function setup() {
            createCanvas(windowWidth, windowHeight);
            frameRate(60);
            generateParticles();
        }

        function draw() {
            background(32, 33, 36, 20);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].display();
                if (particles[i].isDone()) {
                    particles.splice(i, 1);
                }
            }
            if (particles.length < maxParticles) {
                generateParticles();
            }
        }

        function generateParticles() {
            let source = createVector(width / 2, height / 2);
            let numNewParticles = 5;
            for (let i = 0; i < numNewParticles; i++) {
                particles.push(new Particle(source, random([-1, 1])));
            }
        }

        class Particle {
            constructor(source, direction) {
                this.position = source.copy();
                this.speed = p5.Vector.random2D();
                this.speed.mult(random(2, 5));
                this.direction = direction;
                this.size = random(10, 50);
                this.life = 255;
            }

            update() {
                this.position.add(this.speed);
                this.speed.mult(0.98);
                this.size *= 0.99;
                this.life -= 2;
            }

            display() {
                noStroke();
                fill(255, this.life);
                ellipse(this.position.x, this.position.y, this.size);
            }

            isDone() {
                return this.life < 0 || this.size < 1;
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
<a id="archive-link" href="https://www.beautyisapattern.com/archive">Visit the Archive</a>
</body>
</html>
