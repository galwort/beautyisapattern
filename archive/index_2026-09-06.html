<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waves of Influence</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            background-color: #0d1b2a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        canvas {
            display: block;
            border-radius: 10px;
        }
        .archive-link {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #219ebc;
            font-family: Arial, sans-serif;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .archive-link:hover {
            color: #ffb703;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
        }

        function draw() {
            background(9, 14, 34, 25);
            let numShapes = 12;
            for (let i = 0; i < numShapes; i++) {
                let angle = map(i, 0, numShapes, 0, TWO_PI);
                let x = width / 2 + cos(angle) * 200 * sin(frameCount * 0.02 + i * 0.2);
                let y = height / 2 + sin(angle) * 200 * cos(frameCount * 0.02 + i * 0.2);
                let size = map(sin(frameCount * 0.05 + i), -1, 1, 20, 50);
                fill(235, 87, 87, 150);
                ellipse(x, y, size);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <a class="archive-link" href="https://www.beautyisapattern.com/archive" target="_blank">Explore the Archive</a>
</body>
</html>
