<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise of Unity and Balance</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f5f5f5;
        }
        a {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #343a40;
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 8px 20px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        a:hover {
            background-color: rgba(255, 255, 255, 1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

<script>
    let angle = 0;
    let waveOffset = 0;
    let increment = 0.03;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        colorMode(HSB, 360, 100, 100, 1);
    }

    function draw() {
        background(240);
        translate(width / 2, height / 2);

        // Drawing the dynamic wave pattern
        strokeWeight(2);
        noFill();
        for (let y = -height / 3; y <= height / 3; y += 40) {
            let hue = map(y, -height / 3, height / 3, 0, 360);
            stroke(hue, 70, 80);
            beginShape();
            for (let x = -width / 2; x <= width / 2; x += 10) {
                let angleOffset = map(x, -width / 2, width / 2, -PI, PI);
                let wave = sin(angle + angleOffset + waveOffset) * 20;
                vertex(x, y + wave);
            }
            endShape();
        }

        // Drawing the rotating symbol of interconnected circles
        for (let a = 0; a < TWO_PI; a += PI / 4) {
            let radius = map(sin(angle + a), -1, 1, 30, 60);
            let x = cos(a) * 100;
            let y = sin(a) * 100;
            fill(170, 70, 80, 0.5);
            stroke(170, 70, 80);
            ellipse(x, y, radius);
        }

        angle += increment;
        waveOffset += increment / 2;
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>

</html>
