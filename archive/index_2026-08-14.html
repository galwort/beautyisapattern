<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity in Diversity</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b132b;
        }
        #archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #f0f0f0;
            text-decoration: none;
            font-family: Arial, sans-serif;
        }
        #archive-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let pulseCircles = [];
        let starField = [];
        const colors = ['#F93822', '#007f7f', '#00A676', '#0a9396'];

        class PulseCircle {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.angle = 0;
            }

            update() {
                this.angle += 0.02;
                const sizeOffset = sin(this.angle) * 30;
                this.display(this.size + sizeOffset);
            }

            display(size) {
                noStroke();
                fill(random(colors));
                ellipse(this.x, this.y, size);
            }
        }

        class Star {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.z = random(width);
            }

            update() {
                this.z -= 2;
                if (this.z < 1) {
                    this.x = random(width);
                    this.y = random(height);
                    this.z = width;
                }
            }

            display() {
                fill(255);
                noStroke();
                const sx = map(this.x / this.z, 0, 1, 0, width);
                const sy = map(this.y / this.z, 0, 1, 0, height);
                const r = map(this.z, 0, width, 8, 0);
                ellipse(sx, sy, r, r);
            }
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < 6; i++) {
                pulseCircles.push(new PulseCircle(width / 2, height / 2, 200 * (i + 1)));
            }
            for (let i = 0; i < 300; i++) {
                starField.push(new Star(random(width), random(height)));
            }
        }

        function draw() {
            background(11, 19, 43, 40);

            for (let circle of pulseCircles) {
                circle.update();
            }

            for (let star of starField) {
                star.update();
                star.display();
            }

            // Foreground symbolizing unity
            noStroke();
            fill(255, 60);
            ellipse(width / 2, height / 2, 300, 300);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

    <a id="archive-link" href="https://www.beautyisapattern.com/archive">Visit Archive</a>
</body>
</html>
