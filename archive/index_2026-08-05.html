<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Virtue of Happiness</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87ceeb, #f0f8ff);
        }
        #archive-link {
            position: fixed;
            bottom: 10px;
            right: 10px;
            text-decoration: none;
            font-family: 'Arial', sans-serif;
            color: #333;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        #archive-link:hover {
            background-color: #87ceeb;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let particles = [];
        let numParticles = 150;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle(random(width), random(height)));
            }
        }

        function draw() {
            background(240, 248, 255, 20);
            for (let particle of particles) {
                particle.update();
                particle.show();
                particle.connect(particles);
            }
        }

        class Particle {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = p5.Vector.random2D().mult(random(0.5, 2));
                this.diameter = random(4, 12);
                this.col = color(random(200, 255), random(150, 250), random(0, 80), 150);
            }

            update() {
                this.pos.add(this.vel);
                this.edges();
            }

            edges() {
                if (this.pos.x > width || this.pos.x < 0) {
                    this.vel.x *= -1;
                }
                if (this.pos.y > height || this.pos.y < 0) {
                    this.vel.y *= -1;
                }
            }

            show() {
                noStroke();
                fill(this.col);
                ellipse(this.pos.x, this.pos.y, this.diameter);
            }

            connect(others) {
                for (let other of others) {
                    let d = dist(this.pos.x, this.pos.y, other.pos.x, other.pos.y);
                    if (d < 60) {
                        stroke(200, 200, 255, 150);
                        line(this.pos.x, this.pos.y, other.pos.x, other.pos.y);
                    }
                }
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive" target="_blank">Visit the Archive</a>
</body>
</html>
