<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvelous Nature</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f4c3;
        }
        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 1.2em;
            color: #33691e;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px;
        }
        a {
            text-decoration: none;
            color: #1b5e20;
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script>
    let petalCount = 30;
    let petalLength = 100;
    let petalWidth = 20;

    function setup() {
        createCanvas(windowWidth, windowHeight);
        angleMode(DEGREES);
    }

    function draw() {
        background('#f0f4c3');
        translate(width / 2, height / 2);
        noStroke();
        fill(139, 195, 74, 150);
        rotate(frameCount * 0.5);

        for (let i = 0; i < petalCount; i++) {
            push();
            let angle = map(i, 0, petalCount, 0, 360);
            rotate(angle);

            let dynamicScale = map(sin(frameCount), -1, 1, 0.5, 1);
            scale(dynamicScale);

            ellipse(0, petalLength, petalWidth, petalLength);
            pop();
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>

<footer>
    <a href="https://www.beautyisapattern.com/archive">Visit the Archive</a>
</footer>

</body>
</html>
