<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors of Harmony</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" />
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-decoration: none;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }
        #archive-link:hover {
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let nodes = [];
        const maxNodes = 8;
        const speed = 2;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
            for (let i = 0; i < maxNodes; i++) {
                nodes.push(new Node(random(width), random(height)));
            }
        }

        function draw() {
            background(0, 15); // Create a trailing effect
            for (let i = 0; i < nodes.length; i++) {
                nodes[i].update();
                nodes[i].display();

                for (let j = i + 1; j < nodes.length; j++) {
                    stroke(150, 100);
                    strokeWeight(1.5);
                    let d = dist(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y);

                    if (d < 200) { // Line connecting nearby nodes
                        line(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y);
                    }
                }
            }
        }

        class Node {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.xSpeed = random(-speed, speed);
                this.ySpeed = random(-speed, speed);
                this.diameter = random(15, 30);
                this.col = color(random(50, 255), random(50, 255), 255);
            }

            update() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;

                if (this.x > width || this.x < 0) this.xSpeed *= -1;
                if (this.y > height || this.y < 0) this.ySpeed *= -1;
            }

            display() {
                fill(this.col);
                ellipse(this.x, this.y, this.diameter, this.diameter);
            }
        }
    </script>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive" target="_blank">Explore the Archive</a>
</body>
</html>
