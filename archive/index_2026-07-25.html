<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A visual tribute to the potential of self-belief.">
    <title>Dynamic Beings: Dance of Potential</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1c1f24;
            overflow: hidden;
            color: white;
            font-family: 'Trebuchet MS', sans-serif;
        }
        a {
            color: #f39c12;
            position: absolute;
            bottom: 20px;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <script>
        let angle = 0;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();
        }

        function draw() {
            background(28, 31, 36, 50);
            translate(width / 2, height / 2);

            let maxRadius = min(width, height) / 2 * 0.75;
            for (let i = 0; i < TWO_PI; i += PI / 8) {
                push();
                rotate(angle + i);
                drawEmergentShape(maxRadius * sin(angle + i * 2));
                pop();
            }

            angle += 0.01;
        }

        function drawEmergentShape(r) {
            let points = 5;
            let baseColor = color('#e74c3c');
            let dynamicColor = lerpColor(baseColor, color('#3498db'), sin(angle));
            fill(dynamicColor);
            beginShape();
            for (let i = 0; i < TWO_PI; i += TWO_PI / points) {
                let x = r * cos(i);
                let y = r * sin(i);
                vertex(x, y);
            }
            endShape(CLOSE);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <a href="https://www.beautyisapattern.com/archive">Explore the Archive</a>
</body>
</html>
