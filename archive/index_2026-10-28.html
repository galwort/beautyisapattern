<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave of Technology</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #eceff1;
        }
        footer {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        a {
            color: #0077c2;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <script>
        let steamroller;
        let roads = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            steamroller = new Steamroller();
            for (let i = 0; i < width; i += 60) {
                roads.push(new RoadLine(i));
            }
        }

        function draw() {
            background(236, 239, 241);
            roads.forEach(road => {
                road.update();
                road.display();
            });
            steamroller.move();
            steamroller.display();
        }

        class Steamroller {
            constructor() {
                this.x = -100;
                this.size = 150;
            }

            move() {
                this.x += 2;
                if (this.x > width + this.size) {
                    this.x = -this.size;
                }
            }

            display() {
                fill(33, 150, 243);
                rect(this.x - this.size / 2, height - 120, this.size, 100);
                fill(25, 118, 210);
                ellipse(this.x, height - 70, 90, 90);
                ellipse(this.x + this.size / 2, height - 70, 90, 90);
            }
        }

        class RoadLine {
            constructor(startX) {
                this.x = startX;
                this.y = height - 150;
                this.w = 50;
                this.h = 4;
                this.ranY = random(-20, 20);
            }

            update() {
                this.y += this.ranY * 0.01;
                this.ranY += random(-0.5, 0.5);
            }

            display() {
                stroke(0);
                strokeWeight(this.h);
                line(this.x, this.y, this.x + this.w, this.y);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            roads = [];
            for (let i = 0; i < width; i += 60) {
                roads.push(new RoadLine(i));
            }
        }
    </script>

    <footer>
        <a href="https://www.beautyisapattern.com/archive" target="_blank">Visit the Archive</a>
    </footer>
</body>
</html>
