<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strength in Gentleness</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle, rgba(202,234,247,1) 0%, rgba(247,202,234,1) 80%);
        }
        #archive-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            text-decoration: none;
            color: #3b3b3b;
            font-size: 14px;
        }
        canvas {
            position: absolute;
        }
    </style>
</head>
<body>
    <div id="p5-canvas"></div>
    <a id="archive-link" href="https://www.beautyisapattern.com/archive">Visit the Archive</a>

    <script>
        let particles = [];
        let colors = [[238,174,202], [148,187,233], [255,217,179], [241,147,179]];

        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('p5-canvas');
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle(random(width), random(height), random(colors)));
            }
        }

        function draw() {
            background(255, 255, 255, 20);
            particles.forEach(particle => {
                particle.move();
                particle.display();
            });
        }

        class Particle {
            constructor(x, y, color) {
                this.position = createVector(x, y);
                this.velocity = p5.Vector.random2D();
                this.speed = random(0.5, 2);
                this.size = random(5, 15);
                this.color = color;
            }
            
            move() {
                this.position.add(this.velocity.copy().mult(this.speed));
                this.wrapAround();
            }

            wrapAround() {
                if (this.position.x < 0) this.position.x = width;
                if (this.position.x > width) this.position.x = 0;
                if (this.position.y < 0) this.position.y = height;
                if (this.position.y > height) this.position.y = 0;
            }

            display() {
                fill(this.color[0], this.color[1], this.color[2], 150);
                ellipse(this.position.x, this.position.y, this.size);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

</body>
</html>
