<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invisible Harmony</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1e1e2a;
        }
        .archive-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 14px;
            text-decoration: none;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let angle = 0;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            angleMode(DEGREES);
            noFill();
        }

        function draw() {
            background(30, 30, 42);
            translate(width / 2, height / 2);
            rotate(angle);
            drawAbsencePattern();
            angle += 0.08; // Smooth slow rotation
        }

        function drawAbsencePattern() {
            strokeWeight(0.8);

            for (let i = 0; i < 100; i++) {
                let radius = map(i, 0, 100, 20, 350);
                let alpha = map(sin(frameCount / 2), -1, 1, 50, 200);
                stroke(255, 255, 255, alpha); // Subtle white
                ellipse(0, sin(angle * 2 + i) * radius, radius / 10, radius / 10);
                moveInvisibleHands(i);
            }
        }

        function moveInvisibleHands(i) {
            let x1 = cos(angle + i) * 200;
            let y1 = sin(angle + i) * 200;

            let x2 = cos(angle + i + 90) * 200;
            let y2 = sin(angle + i + 90) * 200;

            stroke(200, 160); // Dim line
            line(x1, y1, x2, y2);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
    <a href="https://www.beautyisapattern.com/archive" class="archive-link">Explore the Archive</a>
</body>
</html>
