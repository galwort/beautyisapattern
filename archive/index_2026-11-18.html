<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Within a World</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle, rgba(34,193,195,1) 0%, rgba(253,187,45,1) 100%);
        }
        a {
            position: absolute;
            bottom: 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let particles = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            pixelDensity(1);
            noStroke();
            for (let i = 0; i < 200; i++) {
                particles.push(new Particle(random(width), random(height), i));
            }
        }

        function draw() {
            background(0, 20);
            for (let particle of particles) {
                particle.move();
                particle.connect(particles);
                particle.show();
            }
        }

        class Particle {
            constructor(x, y, index) {
                this.pos = createVector(x, y);
                this.vel = p5.Vector.random2D();
                this.acc = createVector();
                this.color = color(random(150, 255), random(150, 255), random(150, 255));
                this.r = random(1, 4);
                this.index = index;
            }

            move() {
                let noiseForce = noise(this.index * 0.01 + frameCount * 0.01) * TWO_PI * 2;
                this.acc = p5.Vector.fromAngle(noiseForce);
                this.vel.add(this.acc);
                this.vel.limit(2);
                this.pos.add(this.vel);
                this.pos.x = (this.pos.x + width) % width;
                this.pos.y = (this.pos.y + height) % height;
            }

            connect(particles) {
                for (let other of particles) {
                    if (other !== this) {
                        let d = dist(this.pos.x, this.pos.y, other.pos.x, other.pos.y);
                        if (d < 50) {
                            stroke(255, map(d, 0, 50, 255, 100));
                            line(this.pos.x, this.pos.y, other.pos.x, other.pos.y);
                        }
                    }
                }
            }

            show() {
                fill(this.color);
                ellipse(this.pos.x, this.pos.y, this.r * 2);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

    <a href="https://www.beautyisapattern.com/archive">Visit the Archive</a>

</body>
</html>
