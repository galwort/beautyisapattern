<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony in Chaos</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #f0f0f0;
        }

        .archive-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-family: Arial, sans-serif;
            color: #333;
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 3px;
        }

        .archive-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script>
let particles = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  // Create particles
  for (let i = 0; i < 200; i++) {
    particles.push(new Particle(random(width), random(height)));
  }
}

function draw() {
  background(240);
  particles.forEach(particle => {
    particle.update();
    particle.display();
    particle.checkEdges();
  });
}

class Particle {
  constructor(x, y) {
    this.position = createVector(x, y);
    this.velocity = createVector(random(-2, 2), random(-2, 2));
    this.acceleration = createVector(0, 0);
    this.size = random(5, 15);
    this.isFriend = random() < 0.5;
  }

  update() {
    let friendForce = this.isFriend ? 0.1 : -0.1;
    this.acceleration = createVector(friendForce * cos(frameCount / 100), friendForce * sin(frameCount / 100));
    this.velocity.add(this.acceleration);
    this.position.add(this.velocity);
    this.velocity.limit(2);
  }

  display() {
    noStroke();
    fill(this.isFriend ? color(0, 255, 127, 150) : color(255, 69, 0, 150));
    ellipse(this.position.x, this.position.y, this.size);
  }

  checkEdges() {
    if (this.position.x > width || this.position.x < 0) {
      this.velocity.x *= -1;
    }
    if (this.position.y > height || this.position.y < 0) {
      this.velocity.y *= -1;
    }
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>

<a href="https://www.beautyisapattern.com/archive" class="archive-link">Explore the Archive</a>

</body>
</html>
