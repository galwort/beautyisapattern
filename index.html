<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Existential Expression</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
        }
        a {
            color: #f5f5f5;
            text-decoration: none;
            margin: 0 5px;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #ff6961;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let numParticles = 100;
        let particles = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle(random(width), random(height)));
            }
        }

        function draw() {
            background(26);
            particles.forEach(p => {
                p.update();
                p.display();
            });
        }

        class Particle {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = createVector(random(-1, 1), random(-1, 1));
                this.acc = createVector(0, 0);
                this.size = random(5, 15);
            }

            update() {
                this.acc = createVector(noise(this.pos.x * 0.005, this.pos.y * 0.005) - 0.5, noise(this.pos.y * 0.005, this.pos.x * 0.005) - 0.5); 
                this.vel.add(this.acc);
                this.vel.limit(3);
                this.pos.add(this.vel);

                this.edges();
            }

            display() {
                let colorValue = map(this.size, 5, 15, 150, 255);
                fill(colorValue, 10, 10, 100);
                noStroke();
                ellipse(this.pos.x, this.pos.y, this.size);
            }

            edges() {
                if (this.pos.x > width || this.pos.x < 0) this.vel.x *= -1;
                if (this.pos.y > height || this.pos.y < 0) this.vel.y *= -1;
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <footer>
        <a href="https://www.beautyisapattern.com/archive" target="_blank">Explore the Archive</a>
    </footer>
</body>
</html>
