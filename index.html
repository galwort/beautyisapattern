<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embrace the Possibilities</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            overflow: hidden;
        }
        a {
            color: #fff;
            text-decoration: none;
            position: absolute;
            bottom: 10px;
            font-family: 'Arial', sans-serif;
            opacity: 0.7;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let particles = [];
        let maxParticles = 150;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            stroke(255, 150);
            noFill();
        }

        function draw() {
            background(26, 26, 46, 25);

            while (particles.length < maxParticles) {
                particles.push(new Particle(random(width), random(height)));
            }

            particles.forEach(particle => {
                particle.update();
                particle.display();
                particle.edges();
            });

            if (particles.length > maxParticles) {
                particles.splice(0, random(1, 4));
            }
        }

        class Particle {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = p5.Vector.random2D();
                this.acc = createVector(0, 0);
                this.r = random(1, 3);
            }

            update() {
                this.acc.add(p5.Vector.random2D().mult(0.05));
                this.vel.add(this.acc);
                this.vel.limit(3);
                this.pos.add(this.vel);
                this.acc.mult(0);
            }

            display() {
                ellipse(this.pos.x, this.pos.y, this.r * 2);
            }

            edges() {
                if (this.pos.x < 0 || this.pos.x > width) this.vel.x *= -1;
                if (this.pos.y < 0 || this.pos.y > height) this.vel.y *= -1;
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</head>
<body>
    <a href="https://www.beautyisapattern.com/archive">Explore Our Archive</a>
</body>
</html>
