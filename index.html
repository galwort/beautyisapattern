<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflections of Growth</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f1f1f1;
        }
        a.archive-link {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #333;
            text-decoration: none;
            font-family: Arial, sans-serif;
        }
        a.archive-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="https://www.beautyisapattern.com/archive" class="archive-link">Explore the Archive</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let lines = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            background(241);
            strokeWeight(2);
            for (let i = 0; i < 50; i++) {
                lines.push(new AnimatedLine());
            }
        }

        function draw() {
            background(241, 10); // Lightly fade the background

            for (let line of lines) {
                line.update();
                line.display();
            }
        }

        class AnimatedLine {
            constructor() {
                this.x1 = random(width);
                this.y1 = random(height);
                this.x2 = this.x1 + random(-100, 100);
                this.y2 = this.y1 + random(-100, 100);
                this.speed = random(0.5, 2);
                this.color = color(random(100, 255), random(100, 255), random(100, 255), 150);
                this.direction = random(TWO_PI);
            }

            update() {
                this.x1 += this.speed * cos(this.direction);
                this.y1 += this.speed * sin(this.direction);
                this.x2 += this.speed * cos(this.direction);
                this.y2 += this.speed * sin(this.direction);

                // Check boundaries
                if (this.x1 < 0 || this.x1 > width || this.y1 < 0 || this.y1 > height) {
                    this.reset();
                }
            }

            display() {
                stroke(this.color);
                line(this.x1, this.y1, this.x2, this.y2);
            }

            reset() {
                this.x1 = random(width);
                this.y1 = random(height);
                this.x2 = this.x1 + random(-100, 100);
                this.y2 = this.y1 + random(-100, 100);
                this.direction = random(TWO_PI);
                this.color = color(random(100, 255), random(100, 255), random(100, 255), 150);
            }
        }

    </script>
</body>
</html>
