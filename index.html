<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey of the Heart</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #f0f8ff;
            font-family: Arial, sans-serif;
        }
        a.archive-link {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #2c3e50;
            text-decoration: none;
            background-color: #ecf0f1;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        a.archive-link:hover {
            background-color: #bdc3c7;
        }
    </style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script>
    let t = 0;
    let hearts = [];

    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        fill(255, 105, 180, 100);  // Soft pink
    }

    function draw() {
        background(240, 248, 255);
        translate(width / 2, height / 2);

        let r = height / 3.5 * (sin(TWO_PI * t) + 1.1);  // Dynamic radius
        let positions = 18;   // Number of hearts

        for (let i = 0; i < positions; i++) {
            let angle = TWO_PI / positions * i;
            let x = r * cos(angle + t);
            let y = r * sin(angle + t);
            let size = map(sin(t + angle), -1, 1, 10, 30);
            heartShape(x, y, size);
        }

        t += 0.005;  // Increment time
    }

    function heartShape(x, y, size) {
        push();
        translate(x, y);
        beginShape();
        vertex(0, -size / 2);
        bezierVertex(-size / 2, -size, -size, size * 0.2, 0, size);
        bezierVertex(size, size * 0.2, size / 2, -size, 0, -size / 2);
        endShape(CLOSE);
        pop();
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>
<a class="archive-link" href="https://www.beautyisapattern.com/archive">Explore Archive</a>
</body>
</html>
