<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deceptive Realities</title>
    <link rel="icon" href="https://www.beautyisapattern.com/favicon.ico">
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            overflow: hidden;
            color: #aaa;
            font-family: Arial, sans-serif;
        }

        #archive-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #ddd;
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s;
        }

        #archive-link:hover {
            color: #fff;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script>
        let points = [];
        const maxPoints = 200;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noFill();
            for (let i = 0; i < maxPoints; i++) {
                points.push(createVector(random(width), random(height)));
            }
        }

        function draw() {
            background(26, 26, 26, 20); // subtle trailing effect
            strokeWeight(1.5);

            points.forEach(p => {
                let angle = noise(p.x * 0.005, p.y * 0.005) * TWO_PI * 4;
                p.x += cos(angle);
                p.y += sin(angle);

                // Wrapping
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                stroke(lerpColor(color('#FF6347'), color('#4682B4'), abs(sin(frameCount * 0.01))));
                point(p.x, p.y);
            });
        }
    </script>
</head>
<body>

<a id="archive-link" href="https://www.beautyisapattern.com/archive">Visit the Archive</a>

</body>
</html>
